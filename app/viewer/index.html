async function rememberCapture(rawText, spoken = false, mode = 'phrase', saidText = null) {
  addMsg(saidText || rawText, 'user');
  chatInput.value = '';
  sendBtn.disabled = true;
  setStatus('Thinking…');
  try {
    const res = await fetch('/remember', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      // 2.3.0: whether you said it or typed it goes into the note's record.
      body: JSON.stringify({ message: rawText, source: spoken ? 'spoken' : 'typed', mode }),
    });
    const data = await res.json();

    if (!data.ok) {
      // Never let a capture silently fail — say so, in text and out loud.
      addMsg(data.error || 'That note did not save.', 'error');
      speak("I'm afraid that didn't stick, sir — the note wasn't saved.");
      setStatus('');
      sendBtn.disabled = false;
      return;
    }

    applyGraphGrowth(data);
    if (data.node && data.node.path) lastThing = { kind: 'note', path: data.node.path };
    // 2.3.0: the note saved but its record didn't -- say so, never hide it.
    if (data.warning) addMsg(data.warning, 'error');

    refreshInbox();
    lastChatMessage = null;           // 3.7.0: "that" now means this saved note, not an older chat line
    if (captureMode) touchCaptureMode();

    // 2.5.0: the old "file it under Team / Client / Contractor?" pop-up
    // after every unconnected capture is retired -- it was built for the
    // demo business notes, and asked a question almost every time. Linking
    // now happens when you say "sort my inbox": notes that mention the same
    // person, place or organisation are linked, with the reason, and you
    // confirm where things go from the inbox panel.
  } catch (e) {
    addMsg('Could not reach the server: ' + e.message, 'error');
    setStatus('');
  }
  sendBtn.disabled = false;
}

// ---------- Sight: screen sharing ----------
const screenBtn = document.getElementById('screen-btn');
const screenVideo = document.getElementById('screen-video');
const shareIndicator = document.getElementById('share-indicator');

let screenStream = null;

if (!navigator.mediaDevices || !navigator.mediaDevices.getDisplayMedia) {
  screenBtn.disabled = true;
  screenBtn.title = 'Screen sharing not supported in this browser';
}

function setSharingUI(active) {
  screenBtn.classList.toggle('sharing', active);
  shareIndicator.classList.toggle('active', active);
}

async function toggleScreenShare() {
  if (screenStream) {
    screenStream.getTracks().forEach(t => t.stop());
    screenStream = null;
    screenVideo.srcObject = null;
    setSharingUI(false);
    addMsg('Screen share stopped.', 'system');
    return;
  }
  try {
    screenStream = await navigator.mediaDevices.getDisplayMedia({ video: true });
    screenVideo.srcObject = screenStream;
    setSharingUI(true);
    addMsg('Screen sharing started — ask a question about what\'s on screen.', 'system');
    // Covers the case where the person stops sharing from the BROWSER's
    // own UI (the little "Stop sharing" bar) rather than our button — the
    // indicator must not lie about whether a share is still live.
    screenStream.getVideoTracks()[0].addEventListener('ended', () => {
      screenStream = null;
      screenVideo.srcObject = null;
      setSharingUI(false);
      addMsg('Screen share ended.', 'system');
    });
  } catch (e) {
    // User declined the share prompt, or no display available — either way,
    // say so plainly rather than silently doing nothing.
    addMsg('Could not start screen sharing: ' + e.message, 'error');
  }
}
screenBtn.addEventListener('click', toggleScreenShare);

function isScreenShareLive() {
  return !!(screenStream && screenStream.active && screenStream.getVideoTracks()[0]
    && screenStream.getVideoTracks()[0].readyState === 'live');
}

// The frame is captured HERE, at the moment of asking — never cached from
// when the share started, and never reused from a previous question. If
// the share has ended, this returns null and the caller says so rather
// than answering from memory of an old frame.
function captureScreenFrameBase64() {
  if (!isScreenShareLive()) return null;
  const w = screenVideo.videoWidth, h = screenVideo.videoHeight;
  if (!w || !h) return null;
  const canvas = document.createElement('canvas');
  canvas.width = w;
  canvas.height = h;
  canvas.getContext('2d').drawImage(screenVideo, 0, 0, w, h);
  const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
  return dataUrl.split(',')[1] || null;
}

async function seeCapture(question) {
  addMsg(question, 'user');
  chatInput.value = '';
  sendBtn.disabled = true;
  setStatus('Thinking…');

  const frameBase64 = captureScreenFrameBase64();
  if (!frameBase64) {
    addMsg("The share isn't active anymore, sir — nothing to look at.", 'error');
    speak("The share isn't active anymore, sir — nothing to look at.");
    setStatus('');
    sendBtn.disabled = false;
    return;
  }

  try {
    const res = await fetch('/see', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: question, image_base64: frameBase64 }),
    });
    const data = await res.json();
    if (data.error) {
      addMsg(data.error, 'error');
      setStatus('');
    } else {
      addMsg(data.answer, 'assistant');
      speak(data.answer);
      if (data.switch_note) addMsg(data.switch_note, 'system');
      else if (data.model_used) addMsg('via ' + data.model_used, 'system');
    }
  } catch (e) {
    addMsg('Could not reach the server: ' + e.message, 'error');
    setStatus('');
  }
  sendBtn.disabled = false;
}

// ---------- Brain swap ----------
// Keep in sync with SWAP_LEAD_PATTERNS / LIST_PHRASES in server.py. The
// actual matching against known models happens server-side (single source
// of truth for the refuse-rather-than-guess rule) — this only decides
// ROUTING: does this message go to /model at all?
const SWAP_LEAD_RE = /^(switch to|switch brains to|swap to|swap brains to|try on|go back to|revert to|change brains? to)\s+/i;
const LIST_PHRASES = new Set([
  'list brains', 'list models', 'what brains do you have', 'what models do you have',
  'which brains can i switch to', 'which brains do you have', 'show me the brains',
  'what brains are available', 'what can you switch to',
]);

function cleanForBrainMatch(text) {
  return stripLeadingFiller(text.trim().replace(/^[\s"'“”‘’.,;:!?-]+/, ''));
}

function matchBrainSwapTrigger(text) {
  const cleaned = cleanForBrainMatch(text);
  return SWAP_LEAD_RE.test(cleaned) ? cleaned : null;
}

function isBrainListTrigger(text) {
  const cleaned = cleanForBrainMatch(text).toLowerCase().replace(/[?.!]/g, '');
  return LIST_PHRASES.has(cleaned);
}

function updateBrainChip(label) {
  if (!label) return;
  document.getElementById('brain-chip').textContent = label;
  setHudModel(label);
}

// When the request is genuinely ambiguous ("switch to claude sonnet"), the
// server refuses to guess and instead returns options — this renders them
// as one-click buttons so resolving it doesn't require re-parsing a second
// spoken sentence perfectly.
function offerBrainOptions(options) {
  const wrap = document.createElement('div');
  wrap.className = 'msg system';
  wrap.style.display = 'flex';
  wrap.style.flexWrap = 'wrap';
  wrap.style.gap = '6px';
  options.forEach(opt => {
    const btn = document.createElement('button');
    btn.textContent = opt.label;
    btn.style.cssText = 'padding:4px 10px;border-radius:12px;border:1px solid rgba(111,159,255,0.4);' +
      'background:rgba(111,159,255,0.12);color:#cfe0ff;font-size:11px;cursor:pointer;';
    btn.addEventListener('click', () => { wrap.remove(); swapBrain(opt.value); });
    wrap.appendChild(btn);
  });
  chatLog.appendChild(wrap);
  chatLog.scrollTop = chatLog.scrollHeight;
}

async function swapBrain(rawText) {
  addMsg(rawText, 'user');
  chatInput.value = '';
  sendBtn.disabled = true;
  setStatus('Thinking…');
  try {
    const res = await fetch('/model', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: rawText }),
    });
    const data = await res.json();
    if (!data.ok) {
      addMsg(data.error, 'error');
      speak(data.error);
      if (data.clarify && data.options) offerBrainOptions(data.options);
    } else {
      addMsg(data.confirmation, 'assistant');
      speak(data.confirmation);
      updateBrainChip(data.label); // undefined for a "list brains" response — guarded above
    }
  } catch (e) {
    addMsg('Could not reach the server: ' + e.message, 'error');
  }
  setStatus('');
  sendBtn.disabled = false;
}

// ---- Prompt 09: focus sessions --------------------------------------
// Trigger detection here only decides "is this focus-related at all, so
// route it to /focus/command instead of /chat" — which SPECIFIC command
// it is, and all the actual parsing (task text, minutes, seconds), is
// decided server-side in focus_commands.py so there's exactly one place
// that logic can drift out of sync between voice and typed chat.
const FOCUS_START_RE = /\b(start|begin|kick off|kick-off)\b.{0,15}\bfocus\b.{0,15}\bsession\b|\bfocus session on\b|\bhelp me focus on\b/i;
const FOCUS_STOP_RE = /\b(stop|end|finish)\b.{0,15}\bfocus\b(.{0,15}\bsession\b)?/i;
const FOCUS_ABORT_RE = /\babort\b.{0,15}\bfocus\b(.{0,15}\bsession\b)?|\babort\b.{0,15}\bsession\b|\bcancel\b.{0,15}\bfocus\b(.{0,15}\bsession\b)?|\bcancel\b.{0,15}\bsession\b/i;
const FOCUS_STATUS_RE = /\bfocus (session )?status\b|\bhow (much|long).{0,15}(is )?left\b|\bhow am i doing on my focus\b/i;
const FOCUS_PAUSE_RE = /\bpause\b.{0,15}\b(focus|session)\b|\bpause my session\b/i;
const FOCUS_RESUME_RE = /\bresume\b.{0,15}\b(focus|session)\b|\bresume my session\b|\bunpause\b/i;
const FOCUS_EXTEND_RE = /\b(extend|add more time to|give me more time on)\b.{0,15}\b(focus|session)\b|\bextend\b.{0,10}\bby\b/i;
const FOCUS_SNOOZE_RE = /\bsnooze\b|\bgive me (a|an|\d+|one|two|three|four|five|six|seven|eight|nine|ten|fifteen|twenty|thirty|forty|fifty|sixty)\s*(minute|min|second|sec)/i;
const FOCUS_EXCUSE_RE = /\bit'?s (okay|ok)[,.]?\s*i'?m\b|\bi'?m (doing|just doing)\b.{0,20}\b(research|reference|looking something up)\b|\bthis is (part of|related to) (my|the) (work|task)\b/i;
const FOCUS_NAG_RE = /\bcall me out every\b|\bnag me every\b|\bcheck (on|in with) me every\b/i;
// Prompt 11: "lock on this tab" and friends -- mirrors RETARGET_TRIGGER_RE
// in focus_commands.py. Checked first (sendMessage routes focus commands
// before screen-share questions), so mid-session "lock this tab" always
// means the focus target, never the screen share.
const FOCUS_RETARGET_RE = /\block\s+(?:on\s*(?:to)?\s+|onto\s+|in\s+)?(?:to\s+)?this\s+(?:tab|app|window)\b|\bkeep\s+me\s+(?:in|on)\s+this\s+(?:tab|app|window)\b|\bthis\s+is\s+the\s+(?:tab|app|window)\b|\bstay\s+(?:on|in)\s+this\s+(?:tab|app|window)\b/i;

// Prompt 12: drill-sergeant mode on/off -- mirrors focus_commands.py.
const FOCUS_DRILL_RE = /\bdrill[\s-]*sergeant\s+(?:mode|on|off)\b|\bdrill[\s-]*sergeant\s+mode\s+off\b|\b(?:be|act like|act as)\s+(?:a|my)\s+drill[\s-]*sergeant\b|\b(?:turn on|enable|switch to|go)\s+(?:the\s+)?drill[\s-]*sergeant\b|\b(?:stop|no more|enough(?: of)?|turn off|disable)\s+(?:the\s+)?drill[\s-]*sergeant\b|\bgo easy on me\b/i;

function isAnyFocusTrigger(text) {
  return FOCUS_RETARGET_RE.test(text) || FOCUS_DRILL_RE.test(text) ||
    FOCUS_START_RE.test(text) || FOCUS_STOP_RE.test(text) || FOCUS_ABORT_RE.test(text) ||
    FOCUS_STATUS_RE.test(text) || FOCUS_PAUSE_RE.test(text) || FOCUS_RESUME_RE.test(text) ||
    FOCUS_EXTEND_RE.test(text) || FOCUS_SNOOZE_RE.test(text) || FOCUS_EXCUSE_RE.test(text) ||
    FOCUS_NAG_RE.test(text);
}

// Tracked so the FOCUS button below knows whether to start or stop —
// kept in sync by every place that already receives a status object
// (the command responses and the background poll), no extra fetch needed.
let focusSessionActive = false;

function updateFocusChip(status) {
  const chip = document.getElementById('focus-chip');
  focusSessionActive = !!(status && status.active);
  document.getElementById('focus-btn').classList.toggle('active', focusSessionActive);

  if (!status || !status.active) {
    chip.className = '';
    chip.style.display = 'none';
    return;
  }
  const m = String(Math.floor(status.remaining_seconds / 60)).padStart(2, '0');
  const s = String(status.remaining_seconds % 60).padStart(2, '0');
  let cls = 'on-track';
  let label = status.task ? `⏱ ${m}:${s} — ${status.task}` : `⏱ ${m}:${s}`;
  if (status.deferred) { cls = 'on-track'; label = `⏳ ${m}:${s} — locking on…`; }
  else if (status.paused) { cls = 'on-track'; label = `⏸ ${m}:${s} — paused`; }
  else if (status.is_drifted) { cls = 'drifted'; }
  chip.className = cls;
  chip.textContent = label;
}

// Prompt 09 spec: "a FOCUS button in the viewer" alongside voice/text —
// routes through the exact same /focus/command path and phrasing the
// voice/text triggers already use, so there's still only one place
// (focus_commands.py) that decides what a start/stop command means.
const FOCUS_BTN_DEFAULT_MINUTES = 25; // matches focus_commands.DEFAULT_MINUTES
document.getElementById('focus-btn').addEventListener('click', () => {
  hasInteracted = true;
  if (focusSessionActive) {
    sendFocusCommand('stop my focus session');
  } else {
    sendFocusCommand(`start a focus session for ${FOCUS_BTN_DEFAULT_MINUTES} minutes`);
  }
});

// ---- Prompt 10: the deferred lock's one-shot "what are we focusing on?"
// answer window. No wake word, no clicking the mic button — this opens
// automatically, once, right after Jarvis finishes asking, and whatever
// comes back is attached to the session as its intent, not sent through
// the normal command/trigger-matching path.
//
// 2.1.0 fix: the window is now an explicit state that captures the NEXT
// answer however it arrives — the one-shot mic, the regular mic if it was
// already on, or typing. Before this, only the one-shot mic worked: a typed
// answer (or one spoken while the regular mic was already listening) went
// to the notes brain instead. It closes after one answer or INTENT_WINDOW_MS.
const INTENT_WINDOW_MS = 30000;
let intentWindowOpen = false;
let intentWindowTimer = null;

function openIntentWindow() {
  intentWindowOpen = true;
  clearTimeout(intentWindowTimer);
  intentWindowTimer = setTimeout(closeIntentWindow, INTENT_WINDOW_MS);
}

function closeIntentWindow() {
  intentWindowOpen = false;
  clearTimeout(intentWindowTimer);
}

function listenOnceForIntent() {
  if (!intentWindowOpen) return;  // already answered (e.g. typed) before the question finished
  if (isListening) return;        // the regular mic is on: its next sentence is the answer
  if (!SpeechRecognitionImpl) {
    addMsg('(Speech recognition isn\'t available here — just type your answer instead, sir.)', 'error');
    return;
  }
  const oneShot = new SpeechRecognitionImpl();
  oneShot.continuous = false;
  oneShot.interimResults = false;
  oneShot.lang = 'en-GB';

  let handled = false;
  setStatus('Listening for your answer…');
  micBtn.classList.add('listening');

  const cleanup = () => {
    setStatus('');
    micBtn.classList.remove('listening');
  };

  oneShot.onresult = (event) => {
    handled = true;
    const answer = event.results[0][0].transcript.trim();
    cleanup();
    if (answer && intentWindowOpen) sendFocusIntent(answer);
  };
  oneShot.onerror = () => { if (!handled) cleanup(); };
  oneShot.onend = () => { if (!handled) cleanup(); };

  try {
    oneShot.start();
  } catch (e) {
    cleanup();
  }
}

async function sendFocusIntent(rawText) {
  closeIntentWindow();
  addMsg(rawText, 'user');
  chatInput.value = '';
  try {
    const res = await fetch('/focus/intent', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: rawText }),
    });
    const data = await res.json();
    addMsg(data.answer, 'assistant');
    speak(data.answer);
    updateFocusChip(data.status);
  } catch (e) {
    addMsg('Could not reach the server: ' + e.message, 'error');
  }
}

async function sendFocusCommand(rawText) {
  if (SETUP.platform !== 'windows' && FOCUS_START_RE.test(rawText)) {
    addMsg(rawText, 'user'); chatInput.value = '';
    const l = "Focus sessions watch which app is in front, and that only works on Windows for now, sir. Everything else works here.";
    addMsg(l, 'assistant'); speak(l); return;
  }
  addMsg(rawText, 'user');
  chatInput.value = '';
  sendBtn.disabled = true;
  setStatus('Thinking…');
  try {
    const res = await fetch('/focus/command', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: rawText }),
    });
    const data = await res.json();
    addMsg(data.answer, 'assistant');
    if (data.asks_intent) {
      // Open the window now (so a typed answer works straight away), then
      // open the one-shot mic once the question has finished being spoken.
      openIntentWindow();
      speak(data.answer, listenOnceForIntent);
    } else {
      speak(data.answer);
    }
    updateFocusChip(data.status);
  } catch (e) {
    addMsg('Could not reach the server: ' + e.message, 'error');
  }
  setStatus('');
  sendBtn.disabled = false;
}

// Background poll so drift/recovery is announced by voice even if you
// never open the chat log to check — this is what makes the accountability
// feature actually ambient rather than something you have to go ask about.
//
// Deliberately TWO separate requests, not one: /focus/status is a plain,
// repeatable read (safe next to focus_overlay.py's own 1s poll of the same
// endpoint, or a second browser tab); /focus/announcements is a one-time,
// destructive drain of whatever's queued to be said. They used to be the
// same call, which meant the desktop overlay -- polling 4x more often and
// never even looking at that field -- silently won the race for almost
// every drift/recovery line before this tab ever saw it. Only this poll
// should ever call /focus/announcements.
// 2.2.2: when Jarvis is shut down (card's x or Stop Jarvis.bat), a tab in a
// tab-tracking browser is closed for you. A tab in a normally-opened browser
// can't be closed from outside, so after two missed polls in a row (~8s) it
// covers itself with a "Jarvis has stopped" screen and tries to close
// itself (browsers usually refuse that for a tab you opened yourself, which
// is why the screen is there). If Jarvis comes back, the screen goes away.
const STOPPED_AFTER_MISSES = 2;
let missedPolls = 0;
function setStoppedScreen(show) {
  let el = document.getElementById('jarvis-stopped');
  if (show && !el) {
    el = document.createElement('div');
    el.id = 'jarvis-stopped';
    el.style.cssText = 'position:fixed;inset:0;z-index:99999;display:flex;flex-direction:column;' +
      'align-items:center;justify-content:center;gap:12px;background:rgba(5,8,12,0.94);' +
      'color:#cfe8ff;font-family:Segoe UI,system-ui,sans-serif;text-align:center;padding:16px';
    el.innerHTML = '<div style="font-size:28px;letter-spacing:4px">JARVIS HAS STOPPED</div>' +
      '<div style="font-size:15px;opacity:0.8">You can close this tab. Start Jarvis again with Start Jarvis.bat.</div>';
    document.body.appendChild(el);
    try { window.close(); } catch (e) {}
  } else if (!show && el) {
    el.remove();
  }
}

setInterval(async () => {
  try {
    const res = await fetch('/focus/status');
    const data = await res.json();
    missedPolls = 0;
    setStoppedScreen(false);
    updateFocusChip(data.status);
  } catch (e) {
    // Server not reachable this tick. One miss can be a blip; two in a row
    // means Jarvis has been shut down.
    missedPolls += 1;
    if (missedPolls >= STOPPED_AFTER_MISSES) setStoppedScreen(true);
    return;
  }
  try {
    const res = await fetch('/focus/announcements');
    const data = await res.json();
    (data.announcements || []).forEach(msg => {
      addMsg(msg, 'assistant');
      speak(msg);
    });
  } catch (e) {
    // Server not reachable this tick — silently skip, next poll retries.
  }
}, 4000);

// Populate the chip on load with whatever's actually active right now.
fetch('/model').then(r => r.json()).then(d => updateBrainChip(d.label)).catch(() => updateBrainChip('?'));

// ---------- 2.4.0: capture mode ----------
let captureMode = false;
let captureIdleTimer = null;
const CAPTURE_IDLE_MS = 10 * 60 * 1000;   // switches itself off after 10 quiet minutes
let lastChatMessage = null;               // { text, spoken } -- for "save that"

function touchCaptureMode() {
  clearTimeout(captureIdleTimer);
  captureIdleTimer = setTimeout(() => setCaptureMode(false, 'idle'), CAPTURE_IDLE_MS);
}

function setCaptureMode(on, why) {
  captureMode = on;
  document.getElementById('capture-btn').classList.toggle('active', on);
  chatInput.placeholder = on ? 'Capturing: everything goes to your inbox. Say "stop capturing" to finish.'
                             : 'Ask your notes something...';
  let line;
  if (on) {
    touchCaptureMode();
    line = "Capture mode, sir. Everything you say or type goes to your inbox, word for word, until you say \"stop capturing\".";
  } else {
    clearTimeout(captureIdleTimer);
    line = why === 'idle'
      ? 'Capture mode switched itself off after ten quiet minutes, sir.'
      : 'Capture mode off, sir. Back to answering.';
  }
  addMsg(line, 'assistant');
  speak(line);
}

document.getElementById('capture-btn').addEventListener('click', () => setCaptureMode(!captureMode, 'button'));

// ---------- 2.4.0: the inbox ----------
async function refreshInbox() {
  try {
    const res = await fetch('/inbox');
    const data = await res.json();
    const chip = document.getElementById('inbox-chip');
    const asks = (data.needs_you || []).length;
    // 2.5.0: questions waiting for you show on the chip too.
    chip.textContent = `INBOX ${data.count}` + (asks ? ` · ${asks} ?` : '');
    chip.classList.toggle('empty', data.count === 0 && asks === 0);
    if (document.getElementById('inbox-panel').style.display === 'block') renderInbox(data);
    return data;
  } catch (e) {
    return null;
  }
}

const SOURCE_WORDS = { typed: 'typed', spoken: 'spoken', paper: 'from paper', file: 'imported file',
                       clipboard: 'from your clipboard', browser: 'from a web page', email: 'from an email', calendar: 'from your calendar',
                       'person-note': 'person note', jarvis: 'Jarvis follow-up', unknown: '' };

// 2.5.0: where things can go. Same names as sorting.py's HOME_WORDS.
const HOMES = [['NOW', 'Now'], ['PROJECTS', 'Projects'], ['AREAS', 'Areas'], ['KNOWLEDGE', 'Knowledge'],
               ['JOURNAL', 'Journal'], ['SOMEDAY', 'Someday'], ['ARCHIVE', 'Archive'], ['WONDER', 'Wonder']];
const HOME_WORD = Object.fromEntries(HOMES);

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function itemBlock(item, extraMeta) {
  const div = el('div', 'item');
  const when = (item.created || '').replace('T', ' ').slice(0, 16);
  div.append(el('div', 't', item.title), el('div', 'p', item.preview));
  div.append(el('div', 'm', [when, SOURCE_WORDS[item.source] || item.source, item.photo ? 'photo kept' : '', item.file ? item.file + ' kept' : '',
                             ...(extraMeta || [])].filter(Boolean).join(' · ')));
  return div;
}

function actionButton(label, recordId, action, home) {
  const b = el('button', 'ib', label);
  b.addEventListener('click', () => decideItem(recordId, action, home));
  return b;
}

function section(list, title, note) {
  list.append(el('div', 'sec', title));
  if (note) list.append(el('div', 'secnote', note));
}

function renderInbox(data) {
  const asks = data.needs_you || [], uns = data.unsorted || [], done = data.sorted || [];
  document.getElementById('inbox-sub').textContent = data.count
    ? `${data.count} waiting to be sorted. Say "sort my inbox" or press Sort now.`
    : (asks.length ? 'Nothing waiting. A question or two below.' : 'Nothing waiting. Anything you capture lands here first.');
  const list = document.getElementById('inbox-list');
  list.innerHTML = '';
  if (data.count) {
    const sortBtn = el('button', 'ib primary', 'Sort now');
    sortBtn.addEventListener('click', () => sortInbox(sortBtn));
    list.append(sortBtn);
  }
  if (asks.length) {
    section(list, 'NEEDS YOU', "I've left these uncommitted rather than guess.");
    asks.forEach(item => {
      const div = itemBlock(item);
      if (item.question) {
        div.append(el('div', 'q', item.question.text));
        const row = el('div', 'btns');
        item.question.options.forEach(o => row.append(actionButton(o.label, item.id, o.action, o.home)));
        row.append(actionButton('Leave in inbox', item.id, 'inbox'));
        div.append(row);
      }
      list.append(div);
    });
  }
  if (data.count) {
    section(list, 'WAITING');
    data.items.forEach(item => list.append(itemBlock(item)));
  }
  if (uns.length) {
    section(list, "COULDN'T PLACE", 'Choose a home, or leave it for now.');
    uns.forEach(item => {
      const div = itemBlock(item);
      div.append(homePicker(item));
      list.append(div);
    });
  }
  // 3.0.0: tidy-up suggestions. Only ever changes where a note is filed.
  const tidy = data.tidy || { duplicates: [], archive: [], second_look: [] };
  if (tidy.duplicates.length || tidy.archive.length || tidy.second_look.length) {
    section(list, 'TIDY UP', 'Suggestions only. Nothing is deleted; "Keep" means I won\'t ask again.');
    const tbtn = (label, payload) => { const b = el('button', 'ib', label);
      b.addEventListener('click', () => tidyAction(payload)); return b; };
    tidy.duplicates.forEach(d => {
      const div = el('div', 'item'); div.append(el('div', 'q', 'Same thing?'), el('div', 'p', `'${d.keep_title}' and '${d.dup_title}'`));
      const row = el('div', 'btns');
      row.append(tbtn('Merge', { action: 'merge', keep: d.keep, dup: d.dup }), tbtn('Keep both', { action: 'keep', key: d.key }));
      div.append(row); list.append(div);
    });
    tidy.archive.forEach(a => {
      const div = el('div', 'item'); div.append(el('div', 't', a.title), el('div', 'm', a.reason));
      const row = el('div', 'btns');
      row.append(tbtn('Archive', { action: 'archive', record_id: a.id }), tbtn('Keep', { action: 'keep', key: a.key }));
      div.append(row); list.append(div);
    });
    tidy.second_look.forEach(s => {
      const div = el('div', 'item'); div.append(el('div', 't', s.title), el('div', 'm', `I filed it in ${HOME_WORD[s.home] || s.home}, not very sure`));
      const row = el('div', 'btns');
      row.append(actionButton('✓ Right', s.id, 'confirm'), homePicker({ id: s.id, home: s.home }), tbtn('Leave it', { action: 'keep', key: s.key }));
      div.append(row); list.append(div);
    });
  }
  if (done.length) {
    section(list, 'SORTED', 'My reading, until you confirm or change it.');
    done.forEach(item => {
      const meta = [HOME_WORD[item.home] || item.home, item.area,
                    (item.kinds || []).join(', '), item.temporary ? 'for now' : '',
                    item.confirmed ? 'confirmed by you' : 'not yet confirmed'];
      const div = itemBlock(item, meta);
      (item.related || []).forEach(r => div.append(el('div', 'rel', 'Linked: ' + r)));
      const row = el('div', 'btns');
      if (!item.confirmed) row.append(actionButton('✓ Right', item.id, 'confirm'));
      row.append(homePicker(item));
      div.append(row);
      list.append(div);
    });
  }
}

function homePicker(item) {
  const s = el('select', 'hp');
  s.append(el('option', null, 'Move to…'));
  HOMES.forEach(([k, w]) => { if (k !== item.home) { const o = el('option', null, w); o.value = k; s.append(o); } });
  s.addEventListener('change', () => { if (s.value && HOME_WORD[s.value]) decideItem(item.id, 'move', s.value); });
  return s;
}

async function tidyAction(payload) {
  try {
    const d = await (await fetch('/maintenance/apply', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                         body: JSON.stringify(payload) })).json();
    addMsg(d.ok ? d.spoken : d.error, d.ok ? 'assistant' : 'error');
    refreshInbox(); refreshLoops();
  } catch (e) { addMsg(`Couldn't reach Jarvis: ${e.message}`, 'error'); }
}

async function decideItem(recordId, action, home) {
  try {
    const res = await fetch('/sort/decide', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ record_id: recordId, action, home }),
    });
    const data = await res.json();
    if (!data.ok) { addMsg(data.error, 'error'); return; }
    addMsg(data.spoken, 'assistant');
    refreshInbox();
    refreshLoops();
  } catch (e) {
    addMsg(`Couldn't reach Jarvis: ${e.message}`, 'error');
  }
}

async function sortInbox(button) {
  if (button) button.disabled = true;
  setStatus('Sorting…');
  try {
    const res = await fetch('/sort', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' });
    const data = await res.json();
    const line = data.ok ? data.spoken : data.error;
    addMsg(line, data.ok ? 'assistant' : 'error');
    speak(line);
    if (data.graph) {
      GRAPH.nodes = data.graph.nodes; GRAPH.links = data.graph.links; Graph.graphData(GRAPH);
      document.getElementById('node-count').textContent =
        `${GRAPH.nodes.length} notes indexed · ${GRAPH.links.length} links`;
    }
    await showInbox(false);
    refreshLoops();
  } catch (e) {
    addMsg(`Couldn't reach Jarvis to sort: ${e.message}`, 'error');
  }
  setStatus('');
  if (button) button.disabled = false;
}

async function showInbox(speakIt) {
  const data = await refreshInbox();
  if (!data) {
    addMsg("I couldn't reach the inbox just now, sir.", 'error');
    return;
  }
  closePanel();
  document.getElementById('review-panel').style.display = 'none';
  document.getElementById('loops-panel').style.display = 'none';
  renderInbox(data);
  document.getElementById('inbox-panel').style.display = 'block';
  if (speakIt) { addMsg(data.summary, 'assistant'); speak(data.summary); }
}

document.getElementById('inbox-chip').addEventListener('click', () => {
  const panel = document.getElementById('inbox-panel');
  if (panel.style.display === 'block') panel.style.display = 'none';
  else showInbox(false);
});
document.getElementById('inbox-close').addEventListener('click', () => {
  document.getElementById('inbox-panel').style.display = 'none';
});

// ---------- 2.4.0: paper -> photo -> read -> you check it -> inbox ----------
// The original photo is sent to be SAVED exactly as it is; a smaller copy
// is what the vision model reads. Nothing is saved until you press Save.
const paperState = { originalB64: null, extracted: null, model: null };

function fileToDataURL(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = () => reject(r.error);
    r.readAsDataURL(file);
  });
}

function shrinkForReading(dataURL, maxSide = 1600) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      resolve(c.toDataURL('image/jpeg', 0.88).split(',')[1]);
    };
    img.onerror = () => reject(new Error("this browser can't open that picture"));
    img.src = dataURL;
  });
}

function closePaperReview() {
  document.getElementById('paper-review').classList.remove('open');
  document.getElementById('paper-text').value = '';
  document.getElementById('paper-img').removeAttribute('src');
  paperState.originalB64 = paperState.extracted = paperState.model = null;
}

// 5.0.0: documents (TXT/MD/CSV/PDF/DOCX/XLSX) are kept as they are, and one
// note in the inbox stands for each; pictures go on to the photo reader below.
const DOC_RE = /\.(txt|md|markdown|csv|json|log|pdf|docx|xlsx)$/i;
async function handleSourceFile(file) {
  if (file.size > 25 * 1024 * 1024) { const l = "That file is over 25 MB, sir."; addMsg(l, 'error'); speak(l); return; }
  setStatus('Reading the file…');
  try {
    const dataURL = await fileToDataURL(file);
    const d = await (await fetch('/capture/file', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ filename: file.name, data_base64: dataURL.split(',')[1] || '' }) })).json();
    setStatus('');
    addMsg(d.spoken, d.ok ? 'assistant' : 'error'); speak(d.spoken);
    if (d.ok && d.graph) { applyGraph(d.graph); updateEmptyHint(); refreshInbox(); }
  } catch (e) { setStatus(''); addMsg(`Couldn't send that file: ${e.message}.`, 'error'); }
}
async function handlePaperFile(file) {
  if (!file) return;
  if (DOC_RE.test(file.name || '') && !/^image\//.test(file.type)) { await handleSourceFile(file); return; }
  if (!/^image\/(jpeg|png|webp|gif)$/.test(file.type)) {
    const line = "That isn't a JPG, PNG, WebP or GIF picture, sir. An iPhone HEIC photo needs saving as JPG first.";
    addMsg(line, 'error'); speak(line);
    return;
  }
  const status = document.getElementById('paper-status');
  const textBox = document.getElementById('paper-text');
  const save = document.getElementById('paper-save');
  let dataURL, small;
  try {
    dataURL = await fileToDataURL(file);
    small = await shrinkForReading(dataURL);
  } catch (e) {
    addMsg(`Couldn't open that photo: ${e.message}.`, 'error');
    return;
  }
  paperState.originalB64 = dataURL.split(',')[1];
  paperState.extracted = null; paperState.model = null;
  document.getElementById('paper-img').src = dataURL;
  textBox.value = '';
  textBox.disabled = true; save.disabled = true;
  status.textContent = 'Reading your page…';

// ---------- Prompt 14: the stare (screen watch) ----------
// Every five seconds a frame is shrunk to a tiny grey thumbnail and compared
// with the last one HERE, in the browser: zero cost, zero frames leave the
// machine. Only when the screen has sat unchanged past the threshold does
// ONE frame go to the brain, for one nudge; then a three-minute cooldown.
// It uses the same share as "what do you think of this?", so one share
// answers both. Screen only: it never touches the camera.
const WATCH = {
  SAMPLE_MS: 5000,
  STARE_MS: 60000,          // the organ's personality: 60s is demo speed, 4 minutes respects deep work
  COOLDOWN_MS: 180000,
  THUMB_W: 32, THUMB_H: 18,
  CHANGE_LEVEL: 2.5,        // mean grey-level difference that counts as "changed"
};

// Pure (tested in Node): how different two thumbnails are, 0..255.
function frameDiff(a, b) {
  if (!a || !b || a.length !== b.length) return 255;
  let sum = 0;
  for (let i = 0; i < a.length; i++) sum += Math.abs(a[i] - b[i]);
  return sum / a.length;
}

// Pure (tested in Node): one sample in, maybe a 'stare' out.
function watchStep(st, changed, now) {
  if (changed || st.stillSince == null) st.stillSince = now;
  const quiet = now < (st.quietUntil || 0);
  if (!quiet && now - st.stillSince >= WATCH.STARE_MS && now >= (st.cooldownUntil || 0)) {
    st.cooldownUntil = now + WATCH.COOLDOWN_MS;
    st.stillSince = now;
    return ['stare'];
  }
  return [];
}

const watch = { on: false, st: { stillSince: null, cooldownUntil: 0, quietUntil: 0 }, last: null, timer: null };

function thumbnail() {
  const w = screenVideo.videoWidth, h = screenVideo.videoHeight;
  if (!w || !h) return null;
  const c = document.createElement('canvas');
  c.width = WATCH.THUMB_W; c.height = WATCH.THUMB_H;
  const g = c.getContext('2d');
  g.drawImage(screenVideo, 0, 0, c.width, c.height);
  const px = g.getImageData(0, 0, c.width, c.height).data;
  const out = new Array(c.width * c.height);
  for (let i = 0; i < out.length; i++) out[i] = (px[i * 4] + px[i * 4 + 1] + px[i * 4 + 2]) / 3;
  return out;
}

async function startWatch() {
  if (watch.on) { const l = "Already watching, sir."; addMsg(l, 'assistant'); speak(l); return; }
  if (!isScreenShareLive()) {
    try {
      // Open the picker on Entire Screen by default.
      screenStream = await navigator.mediaDevices.getDisplayMedia({
        video: { displaySurface: 'monitor' }, monitorTypeSurfaces: 'include', selfBrowserSurface: 'exclude' });
      screenVideo.srcObject = screenStream;
      setSharingUI(true);
      screenStream.getVideoTracks()[0].addEventListener('ended', () => {
        screenStream = null; screenVideo.srcObject = null; setSharingUI(false); stopWatch(false);
        addMsg('Screen share ended.', 'system');
      });
    } catch (e) { addMsg('Could not start the screen share: ' + e.message, 'error'); return; }
  }
  // THE TAB-SHARE TRAP: a single tab can't show me you wandering off, and
  // scrolling its own content reads as change. Say so and steer.
  const surface = (screenStream.getVideoTracks()[0].getSettings() || {}).displaySurface;
  if (surface && surface !== 'monitor') {
    const l = surface === 'browser'
      ? "That's a single tab, sir. A tab keeps drawing itself while you wander, so I'd never see you stuck or gone. Stop this share and pick Entire Screen instead."
      : "That's a single window, sir, so I'd only ever see that window. Stop this share and pick Entire Screen instead.";
    addMsg(l, 'assistant'); speak(l);
    return;
  }
  watch.on = true; watch.last = null; watch.st.stillSince = null;
  const l = "Watching your screen, sir. Nothing leaves this computer unless you've been stuck a while.";
  addMsg(l, 'assistant'); speak(l);
  const report = () => fetch('/watch/state', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                               body: JSON.stringify({ on: true }) }).catch(() => {});
  report();
  watch.timer = setInterval(async () => {
    if (!isScreenShareLive()) { stopWatch(false); return; }
    report();
    const th = thumbnail();
    if (!th) return;
    const diff = watch.last ? frameDiff(watch.last, th) : null;
    const changed = diff == null || diff > WATCH.CHANGE_LEVEL;
    watch.last = th;
    watch.lastDiff = diff; watch.lastGate = changed ? 'changed' : 'still';   // Prompt 16: for ?focusdebug=1
    watch.st.quietUntil = eyes.st.quietUntil;          // "give me a minute" covers this too
    for (const _ of watchStep(watch.st, changed, Date.now())) {
      const frame = captureScreenFrameBase64();
      if (!frame) continue;
      try {
        const d = await (await fetch('/watch/nudge', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                       body: JSON.stringify({ image_base64: frame }) })).json();
        if (d.line) { addMsg(d.line, 'assistant'); speak(d.line); }
      } catch (e) { /* offline */ }
    }
  }, WATCH.SAMPLE_MS);
}

function stopWatch(say) {
  if (!watch.on) { if (say) addMsg("I wasn't watching, sir.", 'assistant'); return; }
  watch.on = false;
  clearInterval(watch.timer);
  fetch('/watch/state', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ on: false }) }).catch(() => {});
  if (say) { const l = "Stopped watching, sir. The share's still open for questions; the screen button ends it."; addMsg(l, 'assistant'); speak(l); }
}

// ---------- Prompt 13: the eyes ----------
// LOCAL ONLY: face and pose landmarks run in this browser (Google's
// MediaPipe). Only three yes/no signals are used -- present, head down (the
// phone posture), slouched -- and only the posture's NAME ever goes to the
// server. No frame leaves the machine, except the single one you ask for
// with "look at me". THE EAR LAW: nothing here touches the microphone.
const EYES = {
  SUSTAIN_MS: 700,          // a posture must hold this long to count
  COOLDOWN_MS: 30000,       // after a nudge, quiet this long
  AWAY_MS: 12000,           // absence grace: a glance at a notification isn't leaving
  QUIET_MS: 180000,         // "give me a minute"
  HEAD_DOWN_DEG: 20,        // head tipped this far from how you sat at the start
  SLOUCH_RATIO: 0.78,       // nose-to-shoulders height vs how you sat at the start
  CALIBRATE_MS: 3000,       // "sit normally" at the start
  TICK_MS: 150,
};

// Pure: one observation in, maybe a nudge out. Tested in Node (test_eyes.py).
function eyesStep(st, obs, now) {
  const events = [];
  const cond = !obs.present ? 'away' : obs.headDown ? 'phone' : obs.slouched ? 'slouch' : null;
  if (cond !== st.cond) { st.cond = cond; st.since = now; st.fired = false; }
  const need = cond === 'away' ? EYES.AWAY_MS : EYES.SUSTAIN_MS;
  const quiet = now < (st.quietUntil || 0);
  const cooling = now < (st.cooldownUntil || 0);
  if (cond && !st.fired && now - st.since >= need) {
    st.fired = true;                          // once per stretch, whatever happens
    if (!quiet && !cooling) {
      events.push(cond);
      st.cooldownUntil = now + EYES.COOLDOWN_MS;
    }
  }
  return events;
}

const eyes = { on: false, st: { cond: null, since: 0, fired: false, cooldownUntil: 0, quietUntil: 0 },
               stream: null, face: null, pose: null, timer: null, base: null, calib: [] };

async function loadEyesModels() {
  const v = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
  const mp = await import(v);
  const files = await mp.FilesetResolver.forVisionTasks(v + '/wasm');
  const base = 'https://storage.googleapis.com/mediapipe-models/';
  eyes.face = await mp.FaceLandmarker.createFromOptions(files, { runningMode: 'VIDEO', numFaces: 1,
    outputFacialTransformationMatrixes: true,
    baseOptions: { modelAssetPath: base + 'face_landmarker/face_landmarker/float16/1/face_landmarker.task' } });
  eyes.pose = await mp.PoseLandmarker.createFromOptions(files, { runningMode: 'VIDEO', numPoses: 1,
    baseOptions: { modelAssetPath: base + 'pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task' } });
}

function readPosture(video, now) {
  const f = eyes.face.detectForVideo(video, now);
  const p = eyes.pose.detectForVideo(video, now);
  const present = !!(f.faceLandmarks && f.faceLandmarks.length);
  let pitch = null, height = null;
  if (present && f.facialTransformationMatrixes && f.facialTransformationMatrixes.length) {
    const m = f.facialTransformationMatrixes[0].data;       // column-major 4x4
    pitch = Math.atan2(m[6], m[10]) * 180 / Math.PI;
  }
  if (p.landmarks && p.landmarks.length) {
    const L = p.landmarks[0], nose = L[0], ls = L[11], rs = L[12];
    const width = Math.abs(ls.x - rs.x);
    if (width > 0.05) height = (((ls.y + rs.y) / 2) - nose.y) / width;
  }
  return { present, pitch, height };
}

function postureFrom(raw) {
  // Compared with how you sat during the first three seconds (calibration).
  const b = eyes.base || {};
  const headDown = raw.pitch != null && b.pitch != null && Math.abs(raw.pitch - b.pitch) >= EYES.HEAD_DOWN_DEG;
  const slouched = raw.height != null && b.height != null && raw.height < b.height * EYES.SLOUCH_RATIO;
  return { present: raw.present, headDown, slouched };
}

async function eyesNudge(kind) {
  try {
    const d = await (await fetch('/eyes/nudge', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                 body: JSON.stringify({ kind }) })).json();
    if (d.line) { addMsg(d.line, 'assistant'); speak(d.line); }
  } catch (e) { /* offline: nothing to say */ }
}

async function startEyes() {
  if (eyes.on) return;
  const btn = document.getElementById('eyes-btn');
  btn.disabled = true;
  try {
    eyes.stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 }, audio: false });
  } catch (e) {
    btn.disabled = false;
    addMsg("I couldn't get the camera, sir (was it refused, or in use?).", 'error');
    return;
  }
  const video = document.getElementById('eyes-video');
  video.srcObject = eyes.stream;
  try {
    if (!eyes.face) { setStatus('Opening my eyes…'); await loadEyesModels(); }
  } catch (e) {
    stopEyes(false); btn.disabled = false; setStatus('');
    addMsg("I couldn't load the eyes, sir (they download from the internet the first time).", 'error');
    return;
  }
  setStatus('');
  eyes.on = true; eyes.base = null; eyes.calib = []; eyes.st.cond = null;
  btn.disabled = false; btn.classList.add('on');
  const started = performance.now();
  // THE EAR LAW: say so if the ears are off -- never switch them on.
  const line = isListening ? "Eyes on, sir. Sit as you normally would for a moment."
                           : "Eyes on, sir. My ears are off, sir — tap the ear button and just talk.";
  addMsg(line, 'assistant'); speak(line);
  eyes.timer = setInterval(() => {
    if (!eyes.on || video.readyState < 2) return;
    const now = performance.now();
    let raw;
    try { raw = readPosture(video, now); } catch (e) { return; }
    if (!eyes.base) {
      if (raw.present) eyes.calib.push(raw);
      if (now - started >= EYES.CALIBRATE_MS && eyes.calib.length) {
        const avg = k => { const v = eyes.calib.map(r => r[k]).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b) / v.length : null; };
        eyes.base = { pitch: avg('pitch'), height: avg('height') };
      }
      return;
    }
    eyesStep(eyes.st, postureFrom(raw), Date.now()).forEach(eyesNudge);
  }, EYES.TICK_MS);
}

function stopEyes(say) {
  eyes.on = false;
  clearInterval(eyes.timer);
  if (eyes.stream) eyes.stream.getTracks().forEach(t => t.stop());
  eyes.stream = null;
  document.getElementById('eyes-btn').classList.remove('on');
  if (say) { const l = 'Eyes off, sir.'; addMsg(l, 'assistant'); speak(l); }
}

document.getElementById('eyes-btn').addEventListener('click', () => eyes.on ? stopEyes(true) : startEyes());

  box.append(el('div', 'q', q));
  const ta = el('textarea'); ta.placeholder = 'Type or just say it. Leave blank to skip.';
  const row = el('div', 'btns');
  const save = el('button', 'ib primary', 'Next'); save.addEventListener('click', () => answerReview(ta.value, false));
  const skip = el('button', 'ib', 'Skip'); skip.addEventListener('click', () => answerReview('', false));
  row.append(save, skip); box.append(ta, row); list.append(box);
  reviewState.asking = true;
  if (!first) { addMsg(q, 'assistant'); speak(q); }   // the first question ends the spoken summary already
}

async function answerReview(text, spoken) {
  const q = reviewState.questions.shift();
  const a = (text || '').trim();
  if (a && !/^(skip|pass|nothing|no|nope)$/i.test(commandForm(a))) reviewState.answers.push({ question: q, answer: a });
  if (spoken) reviewState.spoken = true;
  askNextReviewQuestion(false);
}

async function finishReview() {
  const kind = reviewState.kind;
  if (!reviewState.answers.length) {
    if (kind !== 'forgotten') addMsg('Very good, sir.', 'assistant');
    return;
  }
  try {
    const d = await (await fetch('/reviews/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind, answers: reviewState.answers, source: reviewState.spoken ? 'spoken' : 'typed' }) })).json();
    const line = d.ok ? d.spoken : d.error;
    addMsg(line, d.ok ? 'assistant' : 'error'); speak(line);
  } catch (e) { addMsg(`Couldn't save your answers: ${e.message}. Nothing was lost from your notes.`, 'error'); }
}

document.getElementById('review-close').addEventListener('click', () => {
  document.getElementById('review-panel').style.display = 'none';
  if (reviewState.asking) { reviewState.asking = false; reviewState.questions = []; finishReview(); }
});

// 2.3.0: set just before the microphone's text is sent; sendMessage reads
// and clears it at once, so the next typed message counts as 'typed'.
let lastInputSpoken = false;

async function sendMessage() {
  const spokenNow = lastInputSpoken;
  lastInputSpoken = false;
  const text = chatInput.value.trim();
  if (!text) return;
  const cmd = commandForm(text);

  // 2.7.0: while a review is asking its question, what you say is the answer.
  if (reviewState.asking) { chatInput.value = ''; addMsg(text, 'user'); await answerReview(text, spokenNow); return; }

  // 2.4.0: capture mode -- everything goes to the inbox, word for word,
  // until you turn it off (button, "stop capturing", or 10 quiet minutes).
  if (captureMode) {
    if (CAPTURE_OFF_RE.test(cmd)) { chatInput.value = ''; setCaptureMode(false, 'said'); return; }
    await rememberCapture(text, spokenNow, 'capture-mode');
    return;
  }
  // Prompt 13: the relief valve works whatever else is going on.
  if (RELIEF_RE.test(cmd)) {
    chatInput.value = ''; addMsg(text, 'user');
    eyes.st.quietUntil = Date.now() + EYES.QUIET_MS;
    try { const d = await (await fetch('/quiet', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{}' })).json();
          addMsg(d.spoken, 'assistant'); speak(d.spoken); } catch (e) { addMsg('Quiet for three minutes, sir.', 'assistant'); }
    return;
  }
  if (WATCH_ON_RE.test(cmd)) { chatInput.value = ''; addMsg(text, 'user'); await startWatch(); return; }
  if (WATCH_OFF_RE.test(cmd)) { chatInput.value = ''; addMsg(text, 'user'); stopWatch(true); return; }
  if (EYES_ON_RE.test(cmd)) { chatInput.value = ''; addMsg(text, 'user'); startEyes(); return; }
  if (EYES_OFF_RE.test(cmd)) { chatInput.value = ''; addMsg(text, 'user'); stopEyes(true); return; }
  if (LOOK_RE.test(cmd)) { chatInput.value = ''; addMsg(text, 'user'); await lookAtMe(text); return; }
  // 5.0.0: "remember this" / "what is this?" -> whatever is on your clipboard
  if (CLIP_SAVE_RE.test(cmd) || (CLIP_ASK_RE.test(cmd) && !isScreenShareLive())) {
    chatInput.value = '';
    if (CLIP_SAVE_RE.test(cmd)) addMsg(text, 'user');
    let clip = '';
    try { clip = (await navigator.clipboard.readText() || '').trim(); } catch (e) {}
    if (!clip) {
      if (!CLIP_SAVE_RE.test(cmd)) addMsg(text, 'user');
      const l = "Your clipboard is empty, or the browser won't let me read it, sir. Copy the text, then say it again, or just paste it here.";
      addMsg(l, 'assistant'); speak(l); return;
    }
    if (CLIP_SAVE_RE.test(cmd)) {
      const d = await (await fetch('/remember', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message: clip, source: 'clipboard', mode: 'paste' }) })).json();
      const l = d.ok ? "From your clipboard, into the inbox, sir. Word for word." : (d.error || "That didn't save, sir.");
      addMsg(l, d.ok ? 'assistant' : 'error'); speak(l);
      if (d.ok && d.graph) { applyGraph(d.graph); updateEmptyHint(); refreshInbox(); }
      return;
    }
    chatInput.value = `What is this? Here it is:\n"""\n${clip.slice(0, 6000)}\n"""`;
    return sendMessage();                      // asked as an ordinary question, with the clipboard in it
  }
  if (CAPTURE_ON_RE.test(cmd)) { chatInput.value = ''; setCaptureMode(true, 'said'); return; }
  if (SAVE_PREVIOUS_RE.test(cmd)) {
    chatInput.value = '';
    if (!lastChatMessage) {
      addMsg(text, 'user');
      const line = "There's nothing before that to save yet, sir.";
      addMsg(line, 'assistant'); speak(line);
      return;
    }
    const prev = lastChatMessage;
    lastChatMessage = null;           // "save that" twice doesn't save it twice
    await rememberCapture(prev.text, prev.spoken, 'save-previous', text);
    return;
  }
  const rv = cmd.match(REVIEW_RE);
  if (rv) { chatInput.value = ''; addMsg(text, 'user'); await startReview(rv[4].toLowerCase()); return; }
  if (FORGOTTEN_RE.test(cmd)) { chatInput.value = ''; addMsg(text, 'user'); await startReview('forgotten'); return; }
  if (LOOPS_RE.test(cmd)) { chatInput.value = ''; addMsg(text, 'user'); await showLoops(true); return; }
  if (WAITING_RE.test(cmd)) { chatInput.value = ''; addMsg(text, 'user'); await showLoops('waiting'); return; }
  if (WHY_RE.test(cmd)) {
    chatInput.value = ''; addMsg(text, 'user');
    try {
      const d = await (await fetch('/decisions/why?q=' + encodeURIComponent(text))).json();
      addMsg(d.spoken, 'assistant'); speak(d.spoken);
    } catch (e) { addMsg(`Couldn't reach Jarvis: ${e.message}`, 'error'); }
    return;
  }
  // 3.7.0: "link that with the two existing notes and file all 3 as X" --
  // taken, linked and filed by Jarvis itself. If the server says it isn't
  // an organising request after all, it carries on to the normal answer.
  if (ORGANISE_HINT_RE.test(cmd)) {
    const d = await organise(text);
    if (d && d.handled) return;
  }
  const rn = cmd.match(RENAME_RE);
  if (rn) { chatInput.value = ''; addMsg(text, 'user'); await starOp({ op: 'rename_named', old: rn[1], new: rn[2] }); return; }
  const lk = cmd.match(LINK_RE);
  if (lk) { chatInput.value = ''; addMsg(text, 'user');
            await linkNotes(/^(unlink|disconnect)$/i.test(lk[1]) ? 'unlink' : 'link', lk[2]); return; }
  if (SORT_RE.test(cmd)) { chatInput.value = ''; addMsg(text, 'user'); await sortInbox(null); return; }
  if (INBOX_QUERY_RE.test(cmd)) { chatInput.value = ''; addMsg(text, 'user'); await showInbox(true); return; }
  if (PAPER_RE.test(cmd)) {
    chatInput.value = ''; addMsg(text, 'user');
    const line = 'Press the 📄 button and choose the photo of your page, sir. You can also drop it onto this window.';
    addMsg(line, 'assistant'); speak(line);
    return;
  }

  if (isAnyFocusTrigger(text)) {
    await sendFocusCommand(text);
    return;
  }

  // Prompt 10: the answer to "what are we focusing on?" -- typed, or spoken
  // through the regular mic -- is the session's intent, not a notes question.
  if (intentWindowOpen) {
    await sendFocusIntent(text);
    return;
  }

  if (isRememberTrigger(text)) {
    await rememberCapture(text, spokenNow);
    return;
  }

  if (isBrainListTrigger(text)) {
    await swapBrain(text);
    return;
  }

  const swapText = matchBrainSwapTrigger(text);
  if (swapText !== null) {
    await swapBrain(swapText);
    return;
  }

  // 2.4.0: remembered so "save that" can put it in the inbox afterwards.
  lastChatMessage = { text, spoken: spokenNow };
  lastThing = { kind: 'chat', text };

  // 2.8.0: questions the spec lists ("what am I putting off?", "what's
  // coming up?"...) are answered straight from your stored notes; anything
  // else goes on to the brain as before.
  if (!isScreenShareLive()) {
    try {
      const a = await (await fetch('/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                            body: JSON.stringify({ question: text }) })).json();
      if (a.intent) {
        chatInput.value = ''; addMsg(text, 'user');
        addMsg(a.spoken, 'assistant'); speak(a.spoken);
        if (a.intent === 'life') showOverview('life');
        if (a.intent === 'work') showOverview('work');
        return;
      }
    } catch (e) { /* the brain below still gets the question */ }
  }

  // While actively sharing, questions go to the eyes, not the notes brain —
  // matches "point at my own screen and ask what I think of this."

  if (isScreenShareLive()) {
    await seeCapture(text);
    return;
  }

  addMsg(text, 'user');
  chatInput.value = '';
  sendBtn.disabled = true;
  setStatus('Thinking…');
  thinkAbout(text);                   // 3.10.0: lights on the notes being thought about
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
    });
    const data = await res.json();
    setThinking(null);
    if (data.error) {
      addMsg(data.error, 'error');
      setStatus('');
    } else {
      addMsg(data.answer, 'assistant');
      speak(data.answer);
      if (data.switch_note) {
        addMsg(data.switch_note, 'system');
      } else if (data.model_used) {
        addMsg('via ' + data.model_used, 'system');
      }
      if (data.model_used) setHudModel(data.model_used);
      if (data.nodes && data.nodes.length && /\?\s*$/.test(text) && GRAPH.nodes[data.nodes[0]])
        lastThing = { kind: 'note', path: GRAPH.nodes[data.nodes[0]].path };   // you asked; this is what we're discussing
      if (data.nodes && data.nodes.length) {
        const holdMs = highlightDurationFor(data.answer);
        let clearHighlight;
        if (data.nodes.length >= 4) {
          clearHighlight = highlightCluster(data.nodes);
        } else {
          const node = GRAPH.nodes[data.nodes[0]];
          if (node) { flyTo(node); showPanel(node); }
          clearHighlight = highlightCluster(data.nodes);
        }
        setTimeout(clearHighlight, holdMs);
      }
    }
  } catch (e) {
    setThinking(null);
    addMsg('Could not reach the server: ' + e.message, 'error');
    setStatus('');
  }
  sendBtn.disabled = false;
}

sendBtn.addEventListener('click', sendMessage);
chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') sendMessage(); });

// ---------- Prompt 16: field proof ----------
// ?focusdebug=1  a small live panel: what the RUNNING server's focus lock
//                sees (/focus/diag: yes/no flags only), plus this page's own
//                state -- last screen-diff and gate, eyes, intent window.
// ?focusprobe=1  a hermetic battery of the page's own focus logic; writes
//                PASS/FAIL per case into the page title. Changes nothing:
//                every case runs on throwaway state, and its one server
//                call is a read.
const FIELD = new URLSearchParams(window.location.search);

function diagLines(d) {
  const yn = v => v === true ? 'yes' : v === false ? 'no' : String(v);
  return [
    'SESSION  on:' + yn(d.session_on) + '  tick thread:' + yn(d.tick_thread_alive) + '  paused:' + yn(d.paused),
    'FRONT    readable:' + yn(d.frontmost_readable) + '  browser:' + yn(d.frontmost_is_browser) + '  tab read:' + d.tab_read,
    '         jarvis tab:' + yn(d.front_is_jarvis) + '  own card:' + yn(d.front_is_own_card) + '  hash:' + yn(d.hash_present),
    'LOCK     deferred:' + yn(d.deferred) + '  settle:' + d.settle_ticks + '/' + d.settle_needed +
      '  app target:' + yn(d.has_app_target) + '  tab target:' + yn(d.has_tab_target) + (d.lock_is_app_only ? ' (app-only)' : ''),
    'ON TARGET app lane:' + yn(d.on_target_app) + '  tab lane:' + yn(d.on_target_tab),
    'DRIFT    drifted:' + yn(d.is_drifted) + '  drifts:' + d.drift_count + '  excused:' + yn(d.excused) +
      '  quiet:' + yn(d.quiet) + '  drill:' + yn(d.drill),
  ];
}

if (FIELD.get('focusdebug') === '1') {
  const box = document.createElement('pre');
  box.id = 'focus-debug';
  box.style.cssText = 'position:fixed;left:8px;bottom:8px;z-index:9999;margin:0;padding:8px 10px;max-width:calc(100vw - 16px);' +
    'box-sizing:border-box;overflow:auto;font:11px/1.45 ui-monospace,Consolas,monospace;color:#9ff;background:rgba(0,10,20,.88);' +
    'border:1px solid #0ff4;border-radius:6px;pointer-events:none;white-space:pre';
  document.body.appendChild(box);
  const tick = async () => {
    let lines;
    try { lines = diagLines(await (await fetch('/focus/diag')).json()); }
    catch (e) { lines = ['SERVER   /focus/diag unreachable']; }
    const diff = watch.lastDiff == null ? '-' : watch.lastDiff.toFixed(2);
    lines.push('PAGE     intent window:' + (intentWindowOpen ? 'open' : 'closed') +
               '  screen watch:' + (watch.on ? 'on' : 'off') + '  last diff:' + diff +
               ' (gate ' + WATCH.CHANGE_LEVEL + ': ' + (watch.lastGate || '-') + ')' +
               '  eyes:' + (eyes.on ? (eyes.st.cond || 'ok') : 'off'));
    box.textContent = 'FOCUS DEBUG\n' + lines.join('\n');
  };
  tick(); setInterval(tick, 2000);
}

// The battery. Each case returns true/false; a throw counts as FAIL.
function focusProbeCases() {
  const T0 = 1000000;
  const freshEyes = () => ({ cond: null, since: 0, fired: false, cooldownUntil: 0, quietUntil: 0 });
  const runEyes = (obs, ms) => { const st = freshEyes(); let out = [];
    for (let t = 0; t <= ms; t += EYES.TICK_MS) out = out.concat(eyesStep(st, obs, T0 + t)); return out; };
  const runWatch = (ms, quiet) => { const st = { stillSince: null, cooldownUntil: 0, quietUntil: quiet ? T0 + ms + 1 : 0 };
    let out = []; for (let t = 0; t <= ms; t += WATCH.SAMPLE_MS) out = out.concat(watchStep(st, false, T0 + t)); return out; };
  return [
    [`viewport-1440x900 (this window: ${window.innerWidth}x${window.innerHeight})`,
     () => window.innerWidth === 1440 && window.innerHeight === 900],
    ['start-phrase', () => FOCUS_START_RE.test('start a focus session on the essay') && !FOCUS_START_RE.test('what is focus')],
    ['stop-vs-abort', () => FOCUS_STOP_RE.test('stop the focus session') && FOCUS_ABORT_RE.test('abort the session')
                             && !FOCUS_ABORT_RE.test('stop the focus session')],
    ['excuse-phrase', () => FOCUS_EXCUSE_RE.test("it's okay, I'm doing research") && !FOCUS_EXCUSE_RE.test('okay')],
    ['retarget-phrase', () => FOCUS_RETARGET_RE.test('lock on this tab') && FOCUS_RETARGET_RE.test('keep me in this app')],
    ['relief-phrase', () => RELIEF_RE.test('give me a minute') && !RELIEF_RE.test('give me a sandwich')],
    ['diff-same-zero', () => frameDiff([1, 2, 3], [1, 2, 3]) === 0 && frameDiff([0, 0], [10, 10]) === 10],
    ['diff-mismatch-max', () => frameDiff(null, [1]) === 255 && frameDiff([1], [1, 2]) === 255],
    ['stare-after-still', () => runWatch(WATCH.STARE_MS, false).length === 1],
    ['stare-not-before', () => runWatch(WATCH.STARE_MS - WATCH.SAMPLE_MS, false).length === 0],
    ['stare-quiet-silent', () => runWatch(WATCH.STARE_MS * 2, true).length === 0],
    ['eyes-phone-sustained', () => runEyes({ present: true, headDown: true }, EYES.SUSTAIN_MS + EYES.TICK_MS).join() === 'phone'],
    ['eyes-glance-ignored', () => runEyes({ present: true, headDown: true }, EYES.SUSTAIN_MS - 2 * EYES.TICK_MS).length === 0],
    ['eyes-away-grace', () => runEyes({ present: false }, EYES.AWAY_MS - 1000).length === 0
                               && runEyes({ present: false }, EYES.AWAY_MS + 200).join() === 'away'],
    ['eyes-once-per-stretch', () => runEyes({ present: true, slouched: true }, EYES.COOLDOWN_MS * 3).length === 1],
    ['intent-window', () => { const was = intentWindowOpen; openIntentWindow(); const a = intentWindowOpen;
                              closeIntentWindow(); const b = intentWindowOpen; if (was) openIntentWindow(); return a && !b; }],
    ['diag-no-identities', async () => { const d = await (await fetch('/focus/diag')).json();
        const TAB = ['read', 'unreadable', 'not_a_browser', 'tab_only', 'no_window_reader'];
        return Object.entries(d).every(([k, v]) => typeof v === 'boolean' || typeof v === 'number'
                                                    || (k === 'tab_read' && TAB.includes(v))); }],
  ];
}

async function runFocusProbe() {
  const results = [];
  for (const [name, fn] of focusProbeCases()) {
    let ok = false;
    try { ok = (await fn()) === true; } catch (e) { ok = false; }
    results.push((ok ? 'PASS ' : 'FAIL ') + name);
  }
  const passed = results.filter(r => r.startsWith('PASS')).length;
  const summary = 'FOCUSPROBE ' + (passed === results.length ? 'PASS' : 'FAIL') + ' ' + passed + '/' + results.length;
  document.title = summary + ' | ' + results.join(' | ');
  console.log(summary + '\n' + results.join('\n'));
  // 3.5.1: every case in the chat, not just the failures (the tab title is too short to read them)
  const box = document.createElement('div');
  box.className = 'msg assistant';
  box.style.whiteSpace = 'pre-line';
  box.style.fontFamily = 'ui-monospace,Consolas,monospace';
  box.textContent = summary + '\n' + results.join('\n');
  const sizeOnly = results.every(r => r.startsWith('PASS') || r.includes('viewport-1440x900'));
  if (passed < results.length && sizeOnly) {
    const note = document.createElement('div');
    note.textContent = '\nOnly the window size is off. The pack runs this at exactly 1440x900:';
    const btn = document.createElement('button');
    btn.textContent = 'Re-run in a 1440x900 window';
    btn.style.cssText = 'margin-top:6px;cursor:pointer';
    btn.onclick = () => window.open(location.pathname + '?mute=1&focusprobe=1', 'jarvis-probe',
                                    'popup,width=1440,height=900');
    box.append(note, btn);
  }
  chatLog.appendChild(box);
  chatLog.scrollTop = chatLog.scrollHeight;
  return { summary, results };
}

if (FIELD.get('focusprobe') === '1') runFocusProbe();

// ---------- 4.0.0: first run, settings, the tour, and help ----------
// For anyone you share Jarvis with: a few friendly screens instead of
// editing config.json, then a one-minute tour. The key goes straight into
// config.json on this computer; the page is only ever told whether one exists.
var SETUP = { has_key: true, first_run: false, address: 'sir', user_name: '', platform: 'windows', samples: false };   // var: read by addMsg/speak from the start

// "sir" in Jarvis's lines -> madam / your name / nothing (same rule as the server).
function addressFix(text) {
  if (typeof text !== 'string' || !text) return text;
  const S = window.SETUP || {}, mode = S.address, name = (S.user_name || '').trim();
  if (mode === 'madam' || (mode === 'name' && name)) {
    const w = mode === 'madam' ? 'madam' : name;
    return text.replace(/\bSir\b(?!\s+[A-Z])/g, w[0].toUpperCase() + w.slice(1)).replace(/\bsir\b/g, w);
  }
  if (mode === 'none') {
    return text.replace(/\s*,\s*sir\b(?=\s*[.!?,;:)—-]|\s*$)/gi, '')
               .replace(/(^|[.!?]\s)sir,\s*(\w)/gi, (m, a, b) => a + b.toUpperCase())
               .replace(/\s+sir\b(?!\s+[A-Z])/g, '');
  }
  return text;
}

async function loadSetup() {
  try { SETUP = await (await fetch('/setup/state')).json(); } catch (e) {}
  if (SETUP.platform !== 'windows') document.getElementById('focus-btn').title = 'Focus sessions need Windows for now';
}

const setupEl = document.getElementById('setup');
const setupCard = document.getElementById('setup-card');
let wiz = { step: 0, fromSettings: false, keyOk: false };

function wizardHTML() {
  const st = wiz.step;

  if (st === 0) return `${n}<h2>Welcome to Jarvis</h2>

    <li>Nothing is tracked, and nobody else can see your notes.</li></ul>
    <div class="row"><button class="primary" data-go="1">Get started</button></div>`;
  if (st === 1) {
    const a = SETUP.address || 'sir';
    const opt = (v, label) => `<label class="opt"><input type="radio" name="addr" value="${v}" ${a === v ? 'checked' : ''}> ${label}</label>`;
    return `${n}<h2>What should Jarvis call you?</h2>
      ${opt('sir', '“Sir” (the classic butler)')}${opt('madam', '“Madam”')}
      <label class="opt"><input type="radio" name="addr" value="name" ${a === 'name' ? 'checked' : ''}> By my name:
        <input type="text" id="setup-name" placeholder="e.g. Sam" value="${(SETUP.user_name || '').replace(/"/g, '&quot;')}" style="margin:0;flex:1"></label>
      ${opt('none', 'Nothing, just talk normally')}
      <p id="setup-msg"></p>
      <div class="row">${wiz.fromSettings ? '<button data-close>Close</button>' : '<button data-go="0">Back</button>'}

  }

    <div class="row">${wiz.fromSettings ? '<button data-close>Close</button>' : '<button data-go="1">Back</button>'}
      ${SETUP.has_key && !wiz.fromSettings ? '<button data-go="3">Keep the saved key</button>' : ''}
      ${!SETUP.has_key && !wiz.fromSettings ? '<button data-go="3" title="Jarvis still stores and shows notes, but can\'t answer or sort without a key">Skip for now</button>' : ''}
      <button data-test>Test</button><button class="primary" data-save-key disabled>Save${wiz.fromSettings ? '' : ' & next'}</button></div>`;
  if (st === 3) return `${n}<h2>Start with sample notes?</h2>
    <p>A galaxy with nothing in it isn't much to look at. Jarvis can add a handful of made-up notes about a small business, so you can see how stars, links and questions work straight away.</p>
    <p>You can remove them any time in ⚙ Settings; your own notes are never touched.</p>
    <p id="setup-msg"></p>
    <div class="row"><button data-samples="0">No, start empty</button><button class="primary" data-samples="1">Yes, add sample notes</button></div>`;
  return `${n}<h2>All set${SETUP.address === 'name' && SETUP.user_name ? ', ' + SETUP.user_name : ''}!</h2>
    <p>Want a one-minute tour of what's on screen? You can take it again any time from <b>? Help</b>.</p>
    <div class="row"><button data-finish>Skip</button><button class="primary" data-tour>Take the tour</button></div>`;

function renderWizard() {
  setupCard.innerHTML = wizardHTML();
  setupEl.style.display = 'flex';
  const msg = t => { const m = document.getElementById('setup-msg'); if (m) m.innerHTML = t; };
  setupCard.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { wiz.step = +b.dataset.go; renderWizard(); });
  setupCard.querySelectorAll('[data-close]').forEach(b => b.onclick = closeWizard);
  const nameBox = document.getElementById('setup-name');
  if (nameBox) nameBox.onfocus = () => { setupCard.querySelector('input[value=name]').checked = true; };
  const saveName = setupCard.querySelector('[data-save-name]');
  if (saveName) saveName.onclick = async () => {
    const address = (setupCard.querySelector('input[name=addr]:checked') || {}).value || 'sir';
    const d = await (await fetch('/setup/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address, user_name: nameBox ? nameBox.value : '' }) })).json();
    if (!d.ok) { msg(`<span class="msg-bad">${d.message}</span>`); return; }
    SETUP = d;
    if (wiz.fromSettings) { msg('<span class="msg-ok">Saved.</span>'); setTimeout(closeWizard, 600); } else { wiz.step = 2; renderWizard(); }
  };
  const testBtn = setupCard.querySelector('[data-test]'), saveKey = setupCard.querySelector('[data-save-key]');
  if (testBtn) testBtn.onclick = async () => {
    const key = document.getElementById('setup-key').value.trim();
    msg('Testing…'); testBtn.disabled = true;
    try {
      const d = await (await fetch('/setup/test', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                    body: JSON.stringify({ key }) })).json();
      msg(`<span class="${d.ok ? 'msg-ok' : 'msg-bad'}">${d.ok ? '✓ ' : ''}${d.message}</span>`);
      saveKey.disabled = !d.ok;
    } catch (e) { msg('<span class="msg-bad">Jarvis itself isn\'t answering. Is it still running?</span>'); }
    testBtn.disabled = false;
  };
  if (saveKey) saveKey.onclick = async () => {
    const key = document.getElementById('setup-key').value.trim();
    const d = await (await fetch('/setup/save', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                  body: JSON.stringify({ openrouter_api_key: key }) })).json();
    if (!d.ok) { msg(`<span class="msg-bad">${d.message}</span>`); return; }
    SETUP = d;
    if (wiz.fromSettings) { msg('<span class="msg-ok">Saved. Jarvis will use the new key from now on.</span>'); } else { wiz.step = 3; renderWizard(); }
  };
  setupCard.querySelectorAll('[data-samples]').forEach(b => b.onclick = async () => {
    if (b.dataset.samples === '1' || (wiz.fromSettings && b.dataset.samples === 'remove')) {
      msg('Adding…');
      const d = await (await fetch('/setup/samples', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                                       body: JSON.stringify({ on: b.dataset.samples === '1' }) })).json();
      if (d.graph) { applyGraph(d.graph); updateEmptyHint(); }
      SETUP.samples = b.dataset.samples === '1';
    }
    if (wiz.fromSettings) { renderSettings(); return; }
    wiz.step = 4; renderWizard();
  });
  const fin = setupCard.querySelector('[data-finish]'), tourBtn = setupCard.querySelector('[data-tour]');
  if (fin) fin.onclick = () => { closeWizard(); bootGreeting(); };
  if (tourBtn) tourBtn.onclick = () => { closeWizard(); bootGreeting(); startTour(); };
}

let tourAt = 0;
const tourSpot = document.getElementById('tour-spot'), tourCard = document.getElementById('tour-card');
function visible(el) { if (!el) return false; const r = el.getBoundingClientRect(); return r.width > 0 && r.height > 0 && getComputedStyle(el).display !== 'none'; }
function tourSteps() { return TOUR.filter(t => !(t.windowsOnly && SETUP.platform !== 'windows') && (!t.sel || visible(document.querySelector(t.sel)))); }
function startTour() { tourAt = 0; document.getElementById('help-panel').style.display = 'none'; showTourStep(); }
function endTour() { tourSpot.style.display = 'none'; tourCard.style.display = 'none'; }
function showTourStep() {
  const steps = tourSteps();
  if (tourAt >= steps.length) { endTour(); return; }
  const t = steps[tourAt];
  tourCard.innerHTML = `<div class="count">${tourAt + 1} / ${steps.length}</div><h3>${t.title}</h3><div>${addressFix(t.text)}</div>
    ${t.try ? `<div class="row" style="justify-content:flex-start"><button data-t="try">▶ ${t.try.label}</button></div>` : ''}
    <div class="row"><button data-t="skip">Skip tour</button>${tourAt ? '<button data-t="back">Back</button>' : ''}
    <button class="primary" data-t="next">${tourAt === steps.length - 1 ? 'Finish' : 'Next'}</button></div>`;
  tourCard.style.display = 'block'; tourCard.style.bottom = '';
  const vw = window.innerWidth, vh = window.innerHeight, cw = tourCard.offsetWidth, ch = tourCard.offsetHeight;
  const el = t.sel && document.querySelector(t.sel);
  if (el) {
    const r = el.getBoundingClientRect(), pad = 6;
    Object.assign(tourSpot.style, { display: 'block', left: (r.left - pad) + 'px', top: (r.top - pad) + 'px',
                                    width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px' });
    let top = r.bottom + 14 + ch < vh ? r.bottom + 14 : r.top - ch - 14;
    let left = Math.min(Math.max(16, r.left + r.width / 2 - cw / 2), vw - cw - 16);
    tourCard.style.top = Math.max(16, top) + 'px'; tourCard.style.left = left + 'px';
  } else {
    Object.assign(tourSpot.style, { display: 'block', left: '50%', top: '50%', width: '0px', height: '0px' });
    tourCard.style.top = Math.max(16, vh / 2 - ch / 2) + 'px'; tourCard.style.left = Math.max(16, vw / 2 - cw / 2) + 'px';
  }
  tourCard.querySelectorAll('[data-t]').forEach(b => b.onclick = () => {
    if (b.dataset.t === 'skip') return endTour();
    if (b.dataset.t === 'try') {                      // lift the dimming so it can be used; Next carries on
      tourSpot.style.display = 'none';
      tourCard.style.top = ''; tourCard.style.bottom = '16px'; tourCard.style.left = '16px';
      try { t.try.fn(); } catch (e) {}
      return;
    }
    tourAt += b.dataset.t === 'next' ? 1 : -1; showTourStep();
  });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') endTour(); });

  ['Eyes and screen', 'The 👁 button watches your posture through the webcam, in your browser only. The screen button shares your screen so you can ask “what do you think of this?”', ['watch my screen']],
  ['Your data', 'Notes are plain text files in the <code>notes</code> folder. The only thing sent anywhere is your question plus the few notes needed to answer it, to OpenRouter\'s AI. Your key lives in <code>config.json</code>; never share that file.', []],
];
function renderHelp() {
  const el = document.getElementById('help-panel');
  el.innerHTML = `<button class="close" title="Close">×</button><h2>What Jarvis can do</h2>
    <p>Click an example to put it in the box, then press Enter.</p>
    <p><button class="try" data-tour>Take the tour again</button></p>` +
    HELP.map(([h, p, ex]) => `<h3>${h}</h3><p>${addressFix(p)}</p>` + ex.map(x => `<button class="ex">${x}</button>`).join('')).join('');
  el.querySelector('.close').onclick = () => { el.style.display = 'none'; };
  el.querySelector('[data-tour]').onclick = () => { el.style.display = 'none'; startTour(); };
  el.querySelectorAll('.ex').forEach(b => b.onclick = () => { chatInput.value = b.textContent; chatInput.focus(); el.style.display = 'none'; });
  el.style.display = 'block';
}
document.getElementById('help-chip').onclick = () => {
  const el = document.getElementById('help-panel');
  if (el.style.display === 'block') el.style.display = 'none'; else renderHelp();
};

// Start: learn the settings first (so the greeting uses the right name), then
// either the first-run screens or the usual greeting.
if (new URLSearchParams(location.search).get('from') === 'boot') {   // 4.3.0: arrived from the boot screen
  document.body.classList.add('from-boot');
  history.replaceState(null, '', location.pathname);
}
loadSetup().then(() => {
  if (SETUP.first_run) { wiz = { step: 0, fromSettings: false, keyOk: false }; renderWizard(); }
  else bootGreeting();
  checkReviewDue();          // re-check now that we know whether it's a first run
});
</script>
