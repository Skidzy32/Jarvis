<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Jarvis — Knowledge Galaxy</title>
<link rel="icon" href="assets/jarvis.png">
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  #graph { position: absolute; inset: 0; }

  #starfield { position: absolute; inset: 0; z-index: 0; pointer-events: none; }

  #panel {
    position: absolute; top: 20px; right: 20px; width: 320px; max-height: 70vh;
    background: rgba(10, 12, 20, 0.88); border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px; padding: 16px; color: #e8e8f0; overflow-y: auto;
    display: none; backdrop-filter: blur(6px); z-index: 5;
  }
  #panel h3 { margin: 0 0 4px 0; font-size: 15px; color: #9fd3ff; }
  #panel .group { font-size: 11px; color: #7a7a90; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; }
  #panel p { font-size: 13px; line-height: 1.5; color: #cfd2e0; }
  #panel .close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: #888; font-size: 16px; }

  #chatbar {
    position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
    width: min(640px, 90vw); z-index: 5;
  }
  #chat-log {
    max-height: 160px; overflow-y: auto; margin-bottom: 8px; display: flex;
    flex-direction: column; gap: 6px;
  }
  .msg { padding: 8px 12px; border-radius: 8px; font-size: 13px; line-height: 1.4; max-width: 90%; }
  .msg.user { align-self: flex-end; background: rgba(80,120,200,0.35); color: #fff; }
  .msg.assistant { align-self: flex-start; background: rgba(255,255,255,0.08); color: #e8e8f0; }
  .msg.error { align-self: flex-start; background: rgba(200,60,60,0.25); color: #ffd8d8; }
  .msg.system { align-self: flex-start; background: transparent; color: #6f7590; font-size: 11px; padding: 0 4px; }

  #input-row { display: flex; gap: 8px; }
  #chat-input {
    flex: 1; padding: 12px 14px; border-radius: 24px; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(20,22,32,0.9); color: #fff; font-size: 14px; outline: none;
  }
  #chat-input:focus { border-color: #6fa8ff; }
  #send-btn {
    padding: 0 18px; border-radius: 24px; border: none; background: #3d6fd8; color: #fff;
    font-size: 14px; cursor: pointer;
  }
  #send-btn:hover { background: #4a7ee8; }
  #send-btn:disabled { background: #333; cursor: default; }

  #node-count {
    position: absolute; top: 20px; left: 20px; color: #7a7a90; font-size: 12px;
    letter-spacing: 0.05em; z-index: 5;
  }
  #brain-chip {
    position: absolute; top: 42px; left: 20px; color: #6f9fff; font-size: 11px;
    letter-spacing: 0.05em; z-index: 5; padding: 2px 8px; border-radius: 10px;
    border: 1px solid rgba(111,159,255,0.3); background: rgba(111,159,255,0.08);
    display: inline-block;
  }
  #focus-chip {
    position: absolute; top: 68px; left: 20px; font-size: 11px;
    letter-spacing: 0.05em; z-index: 5; padding: 2px 8px; border-radius: 10px;
    display: none; font-variant-numeric: tabular-nums;
  }
  #focus-chip.on-track {
    color: #8fffb8; border: 1px solid rgba(39,174,96,0.4); background: rgba(39,174,96,0.1);
    display: inline-block;
  }
  #focus-chip.drifted {
    color: #ffb0b0; border: 1px solid rgba(231,76,60,0.5); background: rgba(231,76,60,0.12);
    display: inline-block;
  }

  #status-line {
    font-size: 11px; color: #6f9fff; letter-spacing: 0.05em; text-transform: uppercase;
    height: 14px; margin-bottom: 6px; text-align: center; min-height: 14px;
  }
  #mic-btn {
    width: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(20,22,32,0.9); color: #fff; font-size: 16px; cursor: pointer;
  }
  #mic-btn.listening { background: #c0392b; border-color: #e74c3c; animation: pulse 1s infinite; }
  #mic-btn:disabled { opacity: 0.4; cursor: default; }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(231,76,60,0.5); } 50% { box-shadow: 0 0 0 8px rgba(231,76,60,0); } }

  #screen-btn {
    width: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(20,22,32,0.9); color: #fff; font-size: 16px; cursor: pointer;
  }
  #screen-btn.sharing { background: #1e8f4e; border-color: #27ae60; }
  #screen-btn:disabled { opacity: 0.4; cursor: default; }

  /* Prompt 09 spec calls for "a FOCUS button in the viewer" as well as
     voice/text -- only the voice/text route existed until this button
     was added. Toggles: starts a default-length session, or stops
     whichever one is currently running. */
  #focus-btn {
    width: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(20,22,32,0.9); color: #fff; font-size: 16px; cursor: pointer;
  }
  #focus-btn.active { background: #1e5f9e; border-color: #3d8fe8; }

  /* Personal OS Phase 2 (2.4.0): capture mode, paper, the inbox. */
  #eyes-btn.on { background: #6b3fa0; border-color: #9a6bd6; }
  #eyes-btn, #capture-btn, #paper-btn {
    width: 44px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);
    background: rgba(20,22,32,0.9); color: #fff; font-size: 16px; cursor: pointer;
  }
  #capture-btn.active { background: #b0522a; border-color: #e0763f; animation: pulse 1.6s infinite; }
  #inbox-chip {
    position: absolute; top: 20px; right: 20px; z-index: 6; cursor: pointer;
    font-size: 11px; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 10px;
    color: #ffd59a; border: 1px solid rgba(255,190,90,0.35); background: rgba(255,190,90,0.08);
  }
  #loops-chip {
    position: absolute; top: 48px; right: 20px; z-index: 6; cursor: pointer;
    font-size: 11px; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 10px;
    color: #9fe0c0; border: 1px solid rgba(90,200,150,0.35); background: rgba(90,200,150,0.08);
  }
  #overview-chip {
    position: absolute; top: 96px; left: 20px; z-index: 6; cursor: pointer; font-size: 11px;
    letter-spacing: 0.08em; padding: 3px 10px; border-radius: 10px; color: #cfe8ff;
    border: 1px solid rgba(159,211,255,0.35); background: rgba(159,211,255,0.08);
  }
  #overview-panel { left: 16px; right: auto; top: 124px; width: min(360px, calc(100vw - 32px)); max-height: 62vh; box-sizing: border-box; }
  #overview-panel .tabs { display: flex; gap: 6px; margin: 6px 0 4px; }
  #overview-panel .tabs button.on { background: #3d6fd8; border-color: #3d6fd8; }
  #review-banner {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 8; display: none;
    align-items: center; gap: 8px; padding: 6px 12px; border-radius: 16px; font-size: 12px;
    background: rgba(255,213,154,0.12); border: 1px solid rgba(255,213,154,0.45); color: #ffe2b8;
    max-width: calc(100vw - 32px); flex-wrap: wrap; justify-content: center;
  }
  #review-banner.show { display: flex; }
  #review-banner button { font-size: 11px; padding: 3px 10px; border-radius: 12px; cursor: pointer;
    border: 1px solid rgba(255,255,255,0.2); background: #1b2030; color: #fff; }
  #review-panel { width: min(420px, calc(100vw - 32px)); max-height: 70vh; }
  #review-panel textarea { width: 100%; box-sizing: border-box; min-height: 60px; margin-top: 6px; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15); background: #151926; color: #fff; padding: 8px; font: 13px/1.4 inherit; }
  #loops-chip.empty { color: #7a7a90; border-color: rgba(255,255,255,0.12); background: transparent; }
  #inbox-chip.empty { color: #7a7a90; border-color: rgba(255,255,255,0.12); background: transparent; }
  #inbox-panel, #loops-panel, #review-panel, #overview-panel {
    position: absolute; top: 78px; right: 20px; width: min(340px, calc(100vw - 32px)); max-height: 60vh;
    background: rgba(10,12,20,0.92); border: 1px solid rgba(255,255,255,0.08); border-radius: 10px;
    padding: 14px 16px; color: #e8e8f0; overflow-y: auto; display: none; z-index: 7;
    backdrop-filter: blur(6px);
  }
  #inbox-panel h3, #loops-panel h3, #review-panel h3, #overview-panel h3 { margin: 0 0 2px 0; font-size: 14px; color: #ffd59a; letter-spacing: 0.08em; }
  #inbox-panel .sub, #loops-panel .sub, #review-panel .sub, #overview-panel .sub { font-size: 11px; color: #7a7a90; margin-bottom: 10px; }
  #inbox-panel .item, #loops-panel .item, #review-panel .item, #overview-panel .item { padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.06); }
  #inbox-panel .item .t, #loops-panel .item .t, #review-panel .item .t, #overview-panel .item .t { font-size: 13px; color: #fff; }
  #inbox-panel .item .p, #loops-panel .item .p, #review-panel .item .p, #overview-panel .item .p { font-size: 12px; color: #b8bccf; margin-top: 2px; line-height: 1.4; }
  #inbox-panel .item .m, #loops-panel .item .m, #review-panel .item .m, #overview-panel .item .m { font-size: 10px; color: #6f7590; margin-top: 3px; letter-spacing: 0.04em; }
  #inbox-panel .sec, #loops-panel .sec, #review-panel .sec, #overview-panel .sec { font-size: 10px; letter-spacing: 0.12em; color: #ffd59a; margin: 12px 0 2px; }
  #inbox-panel .secnote, #loops-panel .secnote, #review-panel .secnote, #overview-panel .secnote { font-size: 11px; color: #7a7a90; margin-bottom: 4px; }
  #inbox-panel .q, #loops-panel .q, #review-panel .q, #overview-panel .q { font-size: 12px; color: #cfe8ff; margin-top: 6px; line-height: 1.4; }
  #inbox-panel .rel, #loops-panel .rel, #review-panel .rel, #overview-panel .rel { font-size: 11px; color: #8fb8ff; margin-top: 3px; }
  #inbox-panel .btns, #loops-panel .btns, #review-panel .btns, #overview-panel .btns { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; align-items: center; }
  #inbox-panel .ib, #inbox-panel .hp, #loops-panel .ib, #loops-panel .hp, #review-panel .ib, #review-panel .hp, #overview-panel .ib, #overview-panel .hp {
    font-size: 11px; padding: 4px 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
    background: #1b2030; color: #fff; cursor: pointer;
  }
  #inbox-panel .ib.primary, #loops-panel .ib.primary, #review-panel .ib.primary, #overview-panel .ib.primary { background: #3d6fd8; border-color: #3d6fd8; margin: 4px 0 2px; }
  #inbox-panel .ib:disabled, #loops-panel .ib:disabled, #review-panel .ib:disabled, #overview-panel .ib:disabled { opacity: 0.5; cursor: default; }
  #inbox-panel .close, #loops-panel .close, #review-panel .close, #overview-panel .close { position: absolute; top: 10px; right: 12px; cursor: pointer; color: #888; }
  /* 2.4.0: five round buttons + Send must still fit a narrow window. */
  #chat-input { min-width: 0; }
  @media (max-width: 560px) {
    #input-row { gap: 4px; }
    #mic-btn, #screen-btn, #focus-btn, #capture-btn, #paper-btn, #eyes-btn { width: 36px; height: 36px; font-size: 14px; padding: 0; }
    #send-btn { padding: 0 12px; }
    #chat-input { padding: 10px 12px; }
  }
  #paper-review {
    position: fixed; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.7); padding: 16px; box-sizing: border-box;
  }
  #paper-review.open { display: flex; }
  #paper-review .box {
    width: min(760px, 100%); max-height: calc(100vh - 32px); overflow: auto; box-sizing: border-box;
    background: #0d1018; border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px;
    color: #e8e8f0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.3fr); gap: 14px;
  }
  @media (max-width: 640px) { #paper-review .box { grid-template-columns: 1fr; } }
  #paper-review img { width: 100%; max-height: 60vh; object-fit: contain; border-radius: 8px; background: #000; }
  #paper-review h3 { margin: 0 0 4px 0; font-size: 14px; color: #9fd3ff; letter-spacing: 0.06em; }
  #paper-review .note { font-size: 12px; color: #9aa0b8; margin-bottom: 8px; line-height: 1.4; }
  #paper-review textarea {
    width: 100%; min-height: 240px; box-sizing: border-box; resize: vertical; border-radius: 8px;
    border: 1px solid rgba(255,255,255,0.15); background: #151926; color: #fff; padding: 10px;
    font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  #paper-review .row { display: flex; gap: 8px; margin-top: 10px; justify-content: flex-end; }
  #paper-review button {
    padding: 8px 16px; border-radius: 18px; border: 1px solid rgba(255,255,255,0.15);
    background: #1b2030; color: #fff; cursor: pointer; font-size: 13px;
  }
  #paper-review button.primary { background: #3d6fd8; border-color: #3d6fd8; }
  #paper-review button:disabled { opacity: 0.5; cursor: default; }

  #share-indicator {
    position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
    display: none; align-items: center; gap: 6px; padding: 6px 14px;
    border-radius: 16px; background: rgba(39,174,96,0.15); border: 1px solid rgba(39,174,96,0.5);
    color: #8fffb8; font-size: 12px; letter-spacing: 0.03em; z-index: 5;
  }
  #share-indicator.active { display: flex; }
  #share-indicator .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #27ae60; animation: pulse2 1.4s infinite;
  }
  @keyframes pulse2 { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
  /* 3.8.0: right-click star menu */
  #star-menu { position: fixed; z-index: 60; min-width: 190px; background: rgba(12,16,30,0.97); border: 1px solid #3a4468;
               border-radius: 8px; padding: 4px 0; box-shadow: 0 6px 24px rgba(0,0,0,0.5); font-size: 13px; display: none; }
  #star-menu .head { padding: 6px 12px; color: #8f98c0; font-size: 11px; max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #star-menu button { display: block; width: 100%; text-align: left; background: none; border: 0; color: #e8e8f0; padding: 7px 12px; cursor: pointer; font: inherit; }
  #star-menu button:hover { background: rgba(120,150,255,0.18); }
  #star-menu button.danger { color: #ff9a9a; }
  #star-menu hr { border: 0; border-top: 1px solid #2a3150; margin: 4px 0; }
  #star-dialog { position: fixed; z-index: 90; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100vw - 32px));
                 box-sizing: border-box; background: rgba(12,16,30,0.98); border: 1px solid #3a4468; border-radius: 10px; padding: 14px; display: none; }
  #star-dialog h3 { margin: 0 0 8px; font-size: 14px; color: #e8e8f0; font-weight: 600; }
  #star-dialog p { margin: 0 0 10px; color: #aab0cc; font-size: 12px; }
  #star-dialog input, #star-dialog textarea { width: 100%; box-sizing: border-box; background: #0a0d18; color: #e8e8f0; border: 1px solid #3a4468;
                 border-radius: 6px; padding: 8px; font: 13px/1.4 inherit; }
  #star-dialog textarea { min-height: 220px; resize: vertical; font-family: ui-monospace, Consolas, monospace; }
  #star-dialog .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
  #star-dialog .row button { padding: 6px 14px; border-radius: 6px; border: 1px solid #3a4468; background: #1a2140; color: #e8e8f0; cursor: pointer; }
  #star-dialog .row button.primary { background: #3553c8; border-color: #3553c8; }
  #star-dialog .row button.danger { background: #8a2c2c; border-color: #8a2c2c; }
  /* 4.5.0: what Jarvis knows about a note */
  #star-dialog .kv { display: grid; grid-template-columns: 120px 1fr; gap: 4px 10px; font-size: 12px; margin: 6px 0 10px; }
  #star-dialog .kv .k { color: #8f98c0; }
  #star-dialog .kv .v { color: #e8e8f0; overflow-wrap: anywhere; }
  #star-dialog select { background: #0a0d18; color: #e8e8f0; border: 1px solid #3a4468; border-radius: 6px; padding: 4px 6px; font: inherit; }
  #star-dialog .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; border: 1px solid #3a4468; }
  #star-dialog .pill.ai { color: #ffcf7a; border-color: #6a5220; }
  #star-dialog .pill.you { color: #9fe6b4; border-color: #22603a; }
  #star-dialog .acts { max-height: 160px; overflow: auto; font-size: 11px; color: #aab0cc; border-top: 1px solid #2a3150; padding-top: 6px; }
  #star-dialog .acts div { padding: 2px 0; }
  #star-banner { position: fixed; z-index: 59; top: 12px; left: 50%; transform: translateX(-50%); background: rgba(53,83,200,0.92); color: #fff;
                 padding: 6px 14px; border-radius: 16px; font-size: 12px; display: none; max-width: calc(100vw - 32px); box-sizing: border-box; }
  /* 3.10.0: the J.A.R.V.I.S. emblem (arc-reactor style) and the model badge */
  #hud { position: fixed; right: 28px; top: 50%; transform: translateY(-50%); width: 190px; z-index: 4;
         display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none;
         --c: #5fe3ff; --spd: 1; font-family: ui-monospace, Consolas, monospace; }
  #hud svg { width: 190px; height: 190px; overflow: visible; filter: drop-shadow(0 0 6px rgba(95,227,255,0.45)); }
  #hud .spin { transform-box: fill-box; transform-origin: center; animation: hudspin calc(var(--d) / var(--spd)) linear infinite; }
  #hud .rev { animation-direction: reverse; }
  @keyframes hudspin { to { transform: rotate(360deg); } }
  #hud .core { transform-box: fill-box; transform-origin: center; }
  #hud.listening .core, #hud.speaking .core { animation: hudpulse 0.9s ease-in-out infinite; }
  @keyframes hudpulse { 50% { transform: scale(1.12); opacity: 0.85; } }
  #hud.thinking { --spd: 3.2; }
  #hud.listening { --spd: 1.8; }
  #hud.speaking { --spd: 2.2; }
  #hud .title { font-size: 10.5px; letter-spacing: 0.22em; fill: #dff8ff; font-weight: 700; }
  #hud-state { font-size: 11px; letter-spacing: 0.3em; color: var(--c); text-shadow: 0 0 8px rgba(95,227,255,0.6); }
  #hud.thinking #hud-state { color: #ffc861; text-shadow: 0 0 8px rgba(255,200,97,0.6); }
  #hud-model { font-size: 10.5px; letter-spacing: 0.12em; color: #cfe9ff; border: 1px solid rgba(95,227,255,0.45);
               border-radius: 12px; padding: 3px 10px; background: rgba(95,227,255,0.07); max-width: 180px;
               overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; }
  @media (max-width: 560px) { #hud { display: none; } }   /* phones: no room; the model shows in the chip top-left */
  @media (max-width: 900px) {
    #hud { top: 72px; right: 12px; transform: none; width: 92px; gap: 4px; }
    #hud svg { width: 92px; height: 92px; }
    #hud-state { font-size: 9px; letter-spacing: 0.18em; }
    #hud-model { font-size: 9px; max-width: 92px; padding: 2px 6px; }
  }
  /* 4.0.0: first-run setup, guided tour, help */
  #aux-chips { position: absolute; top: 124px; left: 20px; z-index: 6; display: flex; gap: 6px; }
  #aux-chips button { cursor: pointer; font-size: 11px; letter-spacing: 0.08em; padding: 3px 10px; border-radius: 10px; color: #cfe8ff;
                      border: 1px solid rgba(159,211,255,0.35); background: rgba(159,211,255,0.08); font-family: inherit; }
  #setup { position: fixed; inset: 0; z-index: 80; background: rgba(2,4,10,0.82); display: none; align-items: center; justify-content: center; padding: 16px; box-sizing: border-box; }
  #setup .card { width: min(560px, 100%); max-height: calc(100vh - 32px); overflow-y: auto; box-sizing: border-box; background: rgba(12,16,30,0.98);
                 border: 1px solid #2f3b66; border-radius: 14px; padding: 22px; color: #e8e8f0; font-size: 14px; line-height: 1.5; }
  #setup h2 { margin: 0 0 6px; font-size: 20px; color: #9fe8ff; letter-spacing: 0.04em; }
  #setup .step { font-size: 11px; letter-spacing: 0.2em; color: #6f7fb0; margin-bottom: 10px; }
  #setup p { margin: 8px 0; color: #c9cee6; }
  #setup ol, #setup ul { margin: 8px 0 8px 20px; padding: 0; color: #c9cee6; }
  #setup li { margin: 4px 0; }
  #setup a { color: #7fd8ff; }
  #setup label.opt { display: flex; gap: 10px; align-items: center; padding: 8px 10px; border: 1px solid #2a3356; border-radius: 8px; margin: 6px 0; cursor: pointer; }
  #setup label.opt:has(input:checked) { border-color: #5fb8ff; background: rgba(95,184,255,0.08); }
  #setup input[type=text], #setup input[type=password] { width: 100%; box-sizing: border-box; background: #0a0d18; color: #e8e8f0; border: 1px solid #3a4468;
                 border-radius: 8px; padding: 9px; font: inherit; margin-top: 6px; }
  #setup .note { font-size: 12px; color: #9aa3c6; background: rgba(95,184,255,0.06); border: 1px solid #243056; border-radius: 8px; padding: 8px 10px; }
  #setup .msg-ok { color: #8fffb8; } #setup .msg-bad { color: #ffb0b0; }
  #setup .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.128.0/three.min.js"></script>
<script src="https://unpkg.com/3d-force-graph@1.71.3/dist/3d-force-graph.min.js"></script>
<script src="graph-data.js"></script>
<script>
// ---------- Starfield background ----------
(function starfield() {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  // 3.9.0: drawn at the screen's real pixel density (sharp on high-DPI
  // screens), more stars, with a slight colour tint and a few bright ones.
  let dpr = 1;
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(window.innerWidth * dpr); canvas.height = Math.round(window.innerHeight * dpr);
    canvas.style.width = window.innerWidth + 'px'; canvas.style.height = window.innerHeight + 'px';
  }
  resize();
  window.addEventListener('resize', resize);
  const TINTS = ['#ffffff', '#ffffff', '#ffffff', '#cfdcff', '#fff1d6', '#dfe8ff'];
  const stars = Array.from({ length: 700 }, () => ({
    x: Math.random(),                 // 3.5.1: fractions of the screen, so the sky
    y: Math.random(),                 // fills any window size after a resize
    r: Math.random() < 0.04 ? Math.random() * 0.8 + 1.2 : Math.random() * 0.9 + 0.25,
    a: Math.random(),
    da: (Math.random() - 0.5) * 0.012,
    c: TINTS[Math.floor(Math.random() * TINTS.length)],
  }));
  function draw() {
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    for (const s of stars) {
      s.a += s.da;
      if (s.a < 0 || s.a > 1) s.da *= -1;
      ctx.globalAlpha = Math.max(0, Math.min(1, s.a));
      ctx.fillStyle = s.c;
      ctx.beginPath();
      ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r * dpr, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  draw();
})();

// ---------- Speech: speaking ----------

// The single most personal number in this build. Too low and it cuts you
// off mid-thought; too high and it feels sluggish. Tune after a day of use.
const FINISH_MS = 900;

// If the page URL contains ?mute=1, nothing in this tab ever speaks. This
// check lives inside speak() itself — the ONE function that produces audio —
// so nothing can route around it.
const IS_MUTED = new URLSearchParams(window.location.search).get('mute') === '1';

const statusLine = document.getElementById('status-line');
function setStatus(text) { statusLine.textContent = text; }

// Browsers block audio until the user has interacted with the page at least
// once. Anything asked to speak before that first click is queued, then
// flushed the moment the interaction happens — so the first line always
// fires reliably, never silently before it's allowed to.
let hasInteracted = false;
let queuedSpeech = null;
document.addEventListener('click', function unlockAudio() {
  hasInteracted = true;
  if (queuedSpeech) {
    const text = queuedSpeech;
    queuedSpeech = null;
    speak(text);
  }
}, { once: true });

let britishVoice = null;
function pickVoice() {
  const voices = speechSynthesis.getVoices();
  britishVoice = voices.find(v => v.lang === 'en-GB') || voices.find(v => v.lang && v.lang.startsWith('en-GB')) || null;
}
pickVoice();
if (typeof speechSynthesis !== 'undefined') {
  speechSynthesis.onvoiceschanged = pickVoice;
}

// onDone (optional) fires once speech has actually finished — or right
// away in every path where it was never going to speak at all (muted, no
// text, no synth support, or queued because audio isn't unlocked yet).
// Prompt 10 needs this: the one-shot intent mic must not open until
// Jarvis has actually finished saying the question, or it'll hear itself.
function speak(text, onDone) {
  text = addressFix(text);
  const finish = () => { if (onDone) onDone(); };
  // 3.10.0: an answer has arrived, so "Thinking…" is over even when nothing
  // is said aloud (muted, or before your first click) -- it used to linger.
  const quiet = () => { if (/^thinking/i.test(statusLine.textContent)) setStatus(''); };
  if (IS_MUTED || !text || typeof speechSynthesis === 'undefined') { quiet(); finish(); return; }
  if (!hasInteracted) { queuedSpeech = text; quiet(); finish(); return; }

  speechSynthesis.cancel(); // don't stack multiple utterances
  const utter = new SpeechSynthesisUtterance(text);
  if (britishVoice) utter.voice = britishVoice;
  utter.onstart = () => setStatus('Speaking…');
  utter.onend = () => { setStatus(''); finish(); };
  utter.onerror = () => { setStatus(''); finish(); };
  speechSynthesis.speak(utter);
}

// ---------- Speech: listening ----------
const SpeechRecognitionImpl = window.SpeechRecognition || window.webkitSpeechRecognition;
const micBtn = document.getElementById('mic-btn');
const INTERRUPT_WORDS = new Set(['stop', 'wait']);

let recognition = null;
let isListening = false;
let speechBuffer = '';
let finishTimer = null;

if (!SpeechRecognitionImpl) {
  micBtn.disabled = true;
  micBtn.title = 'Speech recognition not supported in this browser';
} else {
  recognition = new SpeechRecognitionImpl();
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.lang = 'en-GB';

  recognition.onresult = (event) => {
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      const transcript = result[0].transcript.trim();

      if (!result.isFinal) {
        // Live feedback only — never submitted from here.
        chatInput.value = transcript;
        continue;
      }

      const bare = transcript.toLowerCase().replace(/[.!?]/g, '').trim();
      if (INTERRUPT_WORDS.has(bare)) {
        // Bypass the buffer entirely — this fires instantly, mid-sentence
        // or mid-speech, and never gets sent through /chat as a question.
        speechSynthesis.cancel();
        speechBuffer = '';
        clearTimeout(finishTimer);
        chatInput.value = '';
        setStatus('Listening…');
        continue;
      }

      // Buffer it. If more speech arrives before FINISH_MS fires, append
      // and restart the timer — the pause that truly ends the thought is
      // what sends the whole combined sentence.
      speechBuffer = (speechBuffer ? speechBuffer + ' ' : '') + transcript;
      chatInput.value = speechBuffer;
      clearTimeout(finishTimer);
      finishTimer = setTimeout(() => {
        const finalText = speechBuffer.trim();
        speechBuffer = '';
        if (finalText) {
          chatInput.value = finalText;
          lastInputSpoken = true;
          sendMessage();
        }
      }, FINISH_MS);
    }
  };

  recognition.onend = () => {
    isListening = false;
    micBtn.classList.remove('listening');
    if (!speechSynthesis.speaking) setStatus('');
  };

  recognition.onerror = () => {
    isListening = false;
    micBtn.classList.remove('listening');
    setStatus('');
  };

  micBtn.addEventListener('click', () => {
    if (isListening) {
      recognition.stop();
    } else {
      hasInteracted = true; // clicking the mic counts as interaction too
      speechBuffer = '';
      chatInput.value = '';
      recognition.start();
      isListening = true;
      micBtn.classList.add('listening');
      setStatus('Listening…');
    }
  });
}

// ---------- Color per group ----------
const GROUP_COLORS = {
  clients: '#ff9f6f',
  projects: '#6fd3ff',
  team: '#c98fff',
  processes: '#ffe36f',
  finance: '#6fff9f',
  marketing: '#ff6fb3',
  meetings: '#9fa8ff',
  general: '#cccccc',
  captures: '#8fb4ff',
  categories: '#ffb347',      // 3.9.0: category planets
};
const isPlanet = n => n.group === 'categories';
function colorFor(group) { return GROUP_COLORS[group] || '#8fa0ff'; }

document.getElementById('node-count').textContent =
  `${GRAPH.nodes.length} notes indexed · ${GRAPH.links.length} links`;

// 2.3.0: with no notes the galaxy is just dark space, so say what to do.
function updateEmptyHint() {
  let el = document.getElementById('empty-hint');
  if (GRAPH.nodes.length === 0 && !el) {
    el = document.createElement('div');
    el.id = 'empty-hint';
    el.style.cssText = 'position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);' +
      'max-width:min(420px,calc(100vw - 32px));text-align:center;pointer-events:none;z-index:5;' +
      'color:#9fb8d0;font-family:Segoe UI,system-ui,sans-serif;font-size:15px;line-height:1.5;opacity:0.85';
    el.innerHTML = '<div style="font-size:13px;letter-spacing:3px;margin-bottom:6px">NO NOTES YET</div>' +
      'Say or type <b>"remember that…"</b> and your first star appears here.';
    document.body.appendChild(el);
  } else if (GRAPH.nodes.length > 0 && el) {
    el.remove();
  }
}
updateEmptyHint();

// ---------- Boot greeting ----------
// Always reads the real indexed count from GRAPH — never hardcoded, so it
// stays true if you swap in your own notes and the count changes.
// (Actually triggered at the bottom of the script, after chatLog/speak exist.)
function timeOfDayGreeting() {
  const hour = new Date().getHours();
  if (hour < 12) return 'Good morning';
  if (hour < 18) return 'Good afternoon';
  return 'Good evening';
}
function bootGreeting() {
  // 2.3.0: an empty record is a real state now (demo notes live in examples/).
  const greeting = GRAPH.nodes.length
    ? `${timeOfDayGreeting()}, sir. ${GRAPH.nodes.length} notes indexed, all present and accounted for.`
    : `${timeOfDayGreeting()}, sir. The record is empty — say "remember that…" and it begins.`;
  addMsg(greeting, 'assistant');
  speak(greeting); // queues silently until your first click, per the mute/interaction rules
}

// ---------- 3D Graph ----------
// 3.9.0: sharper and glowing. Smoothed edges (antialias), drawn at the
// screen's real pixel density, rounder spheres, and a soft glow around every
// star (the pack's "nodes glowing"). Categories are planets: bigger, amber,
// with a ring, and the notes filed in them orbit close by.
const GLOW = { SIZE: 26, PLANET_SIZE: 70, OPACITY: 0.55, DIM_OPACITY: 0.06 };
let glowTexture = null;
const glowSprites = new Map();       // node id -> its glow, so highlights can dim it too
function makeGlowTexture() {
  const c = document.createElement('canvas'); c.width = c.height = 128;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(64, 64, 0, 64, 64, 64);
  grad.addColorStop(0, 'rgba(255,255,255,1)');
  grad.addColorStop(0.18, 'rgba(255,255,255,0.55)');
  grad.addColorStop(0.45, 'rgba(255,255,255,0.12)');
  grad.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grad; g.fillRect(0, 0, 128, 128);
  return new THREE.CanvasTexture(c);
}
function starDecoration(n) {
  if (!window.THREE) return null;            // 3D library missing: plain spheres, nothing breaks
  glowTexture = glowTexture || makeGlowTexture();
  const group = new THREE.Group();
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({
    map: glowTexture, color: colorFor(n.group), transparent: true, opacity: GLOW.OPACITY,
    blending: THREE.AdditiveBlending, depthWrite: false }));
  const size = isPlanet(n) ? GLOW.PLANET_SIZE : GLOW.SIZE;
  glow.scale.set(size, size, 1);
  group.add(glow);
  glowSprites.set(n.id, glow);
  if (isPlanet(n)) {                          // a planet's ring
    const ring = new THREE.Mesh(new THREE.RingGeometry(14, 19, 64),
      new THREE.MeshBasicMaterial({ color: '#ffd8a0', transparent: true, opacity: 0.45, side: THREE.DoubleSide, depthWrite: false }));
    ring.rotation.x = Math.PI / 2.6;
    group.add(ring);
  }
  return group;
}
// Every colour change goes through here, so the glows dim with their stars.
function setNodeColors(fn) {
  Graph.nodeColor(fn);
  for (const n of GRAPH.nodes) {
    const glow = glowSprites.get(n.id);
    if (!glow) continue;
    const c = fn(n);
    const dim = typeof c === 'string' && c.startsWith('rgba(255,255,255,0.1');
    glow.material.opacity = dim ? GLOW.DIM_OPACITY : GLOW.OPACITY;
    if (!dim) glow.material.color.set(c);
  }
}

const Graph = ForceGraph3D({ rendererConfig: { antialias: true, alpha: true, powerPreference: 'high-performance' } })(document.getElementById('graph'))
  .graphData(GRAPH)
  .backgroundColor('rgba(0,0,0,0)')
  .nodeLabel(n => isPlanet(n) ? `Category: ${n.label}` : n.label)
  .nodeColor(n => colorFor(n.group))
  .nodeVal(n => isPlanet(n) ? 16 : 2)
  .nodeResolution(24)
  .nodeOpacity(0.95)
  .nodeThreeObjectExtend(true)
  .nodeThreeObject(n => starDecoration(n))
  .linkColor(l => l.orbit ? 'rgba(255,190,110,0.35)' : 'rgba(255,255,255,0.15)')
  .linkOpacity(0.4)
  .onNodeRightClick((node, ev) => onStarRightClick(node, ev))
  .onNodeClick(node => {
    flyTo(node);
    showPanel(node);
    highlightNeighbors(node.id);
  });

// A standalone note with no links is a legitimate outcome, not a bug — but
// the physics engine has nothing pulling an unlinked node back toward the
// cluster, so repulsion alone can push it arbitrarily far away over time.
// This just caps how far ANY node can drift, linked or not, without
// touching which notes are actually related to which.
// 3.9.0: sharp on high-density screens (capped at 2x so big monitors stay smooth).
try { Graph.renderer().setPixelRatio(Math.min(window.devicePixelRatio || 1, 2)); } catch (e) {}
// Notes filed in a category sit close to its planet, like moons.
try { Graph.d3Force('link').distance(l => l.orbit ? 22 : 45); } catch (e) {}

const MAX_DRIFT_RADIUS = 420;
Graph.onEngineTick(() => {
  GRAPH.nodes.forEach(n => {
    const dist = Math.hypot(n.x || 0, n.y || 0, n.z || 0);
    if (dist > MAX_DRIFT_RADIUS) {
      const k = MAX_DRIFT_RADIUS / dist;
      n.x *= k; n.y *= k; n.z *= k;
      if (n.vx) n.vx *= 0.3;
      if (n.vy) n.vy *= 0.3;
      if (n.vz) n.vz *= 0.3;
    }
  });
});

// 3.5.1 (P5): keep the galaxy filling and centred in ANY window size. The
// 3D view only reads the window size once, at start-up, so maximising,
// going fullscreen, resizing or moving to another monitor left it drawn at
// the old size (off-centre, or cut off). Now every resize re-sizes it, and
// the camera steps back in tall/narrow windows so the whole galaxy fits.
const BASE_DISTANCE = 400;
function cameraDistance() {
  const aspect = window.innerWidth / Math.max(1, window.innerHeight);
  return aspect >= 1 ? BASE_DISTANCE : Math.min(BASE_DISTANCE / aspect, BASE_DISTANCE * 2.5);
}
let resizeQueued = false;
function fitGalaxy() {
  resizeQueued = false;
  const el = document.getElementById('graph');
  Graph.width(el.clientWidth || window.innerWidth).height(el.clientHeight || window.innerHeight);
  if (window.__userInteracted) {
    // keep your angle, re-aim at the centre, at a distance that fits
    const c = Graph.cameraPosition();
    const len = Math.hypot(c.x, c.y, c.z) || 1;
    const d = Math.max(len, cameraDistance());
    Graph.cameraPosition({ x: c.x / len * d, y: c.y / len * d, z: c.z / len * d }, { x: 0, y: 0, z: 0 });
  }
}

// slow idle rotation
let angle = 0;
(function idleRotate() {
  if (!window.__userInteracted) {
    angle += 0.0015;
    const distance = cameraDistance();
    Graph.cameraPosition({
      x: distance * Math.sin(angle),
      z: distance * Math.cos(angle),
    });
  }
  requestAnimationFrame(idleRotate);
})();

function flyTo(node) {
  const distRatio = 1 + 80 / Math.hypot(node.x || 1, node.y || 1, node.z || 1);
  Graph.cameraPosition(
    { x: (node.x || 0) * distRatio, y: (node.y || 0) * distRatio, z: (node.z || 0) * distRatio },
    node,
    1200
  );
}

function highlightNeighbors(nodeId) {

// How long to hold a chat-triggered highlight: scaled to how much there is
// to read/hear, with a floor so even a one-line answer gives you enough
// time to actually see which notes lit up.
const MIN_HIGHLIGHT_MS = 3000;
const WORDS_PER_MINUTE = 165; // roughly average spoken pace
function highlightDurationFor(text) {
  const words = (text || '').trim().split(/\s+/).filter(Boolean).length;
  const speakingMs = (words / WORDS_PER_MINUTE) * 60000;
  return Math.max(MIN_HIGHLIGHT_MS, speakingMs);
}

// ---------- Growth: "remember that ..." ----------
// Keep REMEMBER_PATTERNS in sync with server.py's version.
//
// A speech recognizer routinely prepends small filler ("um", "so", "yeah")
// and sometimes drops small words like "that" — a strict startsWith on the
// literal phrase misses real, clearly-spoken triggers for exactly that
// reason. These patterns match on the KEY word (remember / note to self /
// etc.) with everything else optional, and filler is stripped first.
const LEADING_FILLERS = ['um', 'umm', 'uh', 'er', 'yeah', 'yep', 'ok', 'okay', 'so', 'well', 'hey', 'oh', 'and', 'jarvis', 'please'];

function stripLeadingFiller(text) {
  const words = text.trim().split(/\s+/);
  while (words.length > 1 && LEADING_FILLERS.includes(words[0].toLowerCase().replace(/[.,!?]/g, ''))) {
    words.shift();
  }
  return words.join(' ');
}

const REMEMBER_PATTERNS = [
  /^remember\s+(that\s+|to\s+)?/i,
  /^note\s+to\s+self[,:]?\s*/i,
  /^don'?t\s+let\s+me\s+forget\s+(that\s+)?/i,
  /^log\s+this[,:]?\s*/i,
  // 2.4.0 -- same list as server.py (test_capture.py checks they agree).
  /^remind\s+me\s+(to|that|about)\s+/i,
  /^make\s+a\s+note\s+(that\s+|of\s+)?/i,
  /^(jot|write)\s+(this\s+|that\s+)?down[,:]?\s*(that\s+)?/i,
  /^add\s+(this\s+|that\s+)?to\s+(my\s+)?inbox[,:]?\s*/i,
  /^(capture|save)\s+this\s*[,:]\s*/i,
  /^(note|idea|inbox|thought)\s*:\s*/i,
];

// ---------- 2.4.0: capture mode, "save that", the inbox, paper ----------
// Whole-message commands, checked after filler and end punctuation are
// stripped. Keep in sync with CAPTURE_COMMANDS in test_capture.py.
const CLIP_SAVE_RE = /^((remember|save|keep|capture|log)\s+(this|what'?s\s+on\s+my\s+clipboard|my\s+clipboard|the\s+clipboard)|(save|capture)\s+(from\s+)?(my\s+|the\s+)?clipboard)$/i;   // 5.0.0
const CLIP_ASK_RE = /^(what\s+is\s+this|what'?s\s+this|what'?s\s+on\s+my\s+clipboard|explain\s+this)$/i;
const CAPTURE_ON_RE = /^(start\s+capturing|capture\s+mode(\s+on)?|turn\s+on\s+capture(\s+mode)?|brain\s*dump(\s+mode)?|let\s+me\s+brain\s*dump)$/i;
const CAPTURE_OFF_RE = /^((stop|end|exit|finish|done)\s+(capturing|capture(\s+mode)?)|capture\s+(mode\s+)?off|turn\s+off\s+capture(\s+mode)?)$/i;
const SAVE_PREVIOUS_RE = /^((save|capture|keep|log|remember)\s+that(\s+one)?(\s+(to|in)\s+(my\s+)?inbox)?|that('?s|\s+was|\s+is)\s+a\s+note)$/i;
const INBOX_QUERY_RE = /^((what'?s|what\s+is)\s+in\s+my\s+inbox|(show|open|read)(\s+me)?\s+my\s+inbox|how\s+many\s+things\s+are\s+in\s+my\s+inbox|check\s+my\s+inbox|my\s+inbox|inbox)$/i;
const SORT_RE = /^(sort|process|organi[sz]e|tidy(\s+up)?|go\s+through)\s+(my\s+|the\s+)?inbox$/i;
const LOOPS_RE = /^(what\s+are\s+my\s+(open\s+)?loops|what'?s\s+on\s+my\s+plate|what\s+do\s+i\s+(still\s+)?need\s+to\s+do|what'?s\s+(due|outstanding)|show(\s+me)?\s+my\s+(loops|open\s+loops|tasks|projects)|(my\s+)?(open\s+)?loops)$/i;
const WAITING_RE = /^what\s+am\s+i\s+waiting\s+(on|for)$/i;
const WHY_RE = /^why\s+did\s+i\s+(decide|choose|pick|go\s+with|opt)\b/i;
const REVIEW_RE = /^((start|do|run|open)\s+)?(my\s+|the\s+)?(morning|evening|weekly)\s+review$/i;
const FORGOTTEN_RE = /^(have\s+i\s+forgotten\s+anything|what\s+have\s+i\s+forgotten|(is\s+there\s+)?anything\s+i'?ve\s+forgotten|did\s+i\s+forget\s+anything)$/i;
// Prompt 13 -- the eyes. (Never "what do you think of this screen": that's the screen organ.)
const LOOK_RE = /^(look\s+at\s+me|how\s+do\s+i\s+look|do\s+i\s+look\s+(ok|okay|alright|all\s+right)|what\s+do\s+you\s+think\s+of\s+my\s+(shirt|top|hair|outfit|jumper|hoodie|glasses|look|face|beard|hat))$/i;
const RELIEF_RE = /^((no[\s,]+)?(jarvis[\s,]+)?i\s+need\s+to\s+do\s+something\s+important|give\s+me\s+a\s+(minute|min|sec|second|moment))$/i;
const EYES_ON_RE = /^(eyes\s+on|turn\s+on\s+(your|the)\s+eyes|watch\s+me|start\s+(the\s+)?eyes)$/i;
const EYES_OFF_RE = /^(eyes\s+off|turn\s+off\s+(your|the)\s+eyes|stop\s+watching\s+me|stop\s+(the\s+)?eyes)$/i;
// Prompt 14 -- the stare.
const WATCH_ON_RE = /^(watch\s+my\s+screen|keep\s+an\s+eye\s+on\s+my\s+screen|start\s+watching(\s+my\s+screen)?)$/i;
const WATCH_OFF_RE = /^(stop\s+watching(\s+my\s+screen)?|stop\s+the\s+(screen\s+)?watch|don'?t\s+watch\s+my\s+screen)$/i;
// 3.6.0: linking is done by Jarvis itself, never handed to the chat model.
const RENAME_RE = /^rename\s+(?:the\s+|my\s+)?(?:category|project|star|note|folder)?\s*['"“]?(.+?)['"”]?\s+to\s+['"“]?(.+?)['"”]?$/i;
const LINK_RE = /^(?:(?:can|could|would)\s+you\s+|jarvis[\s,]+)?(link|connect|unlink|disconnect)\s+(?:up\s+)?(.+?)(?:\s+(?:up|together))?$/i;
const ORGANISE_HINT_RE = /\b(link|linked|linking|unlink|connect|connected|disconnect|join|joined|tie|tied|file|filed|filing|group|grouped|categori[sz]ed?|organi[sz]ed?|put|move|moved|tag|tagged|add|added|place|placed)\b/i;
const PAPER_RE = /^((process|read|scan|add)\s+(this|a|my)\s+(page|paper|note|photo)|paper\s+note)$/i;

function commandForm(text) {
  return stripLeadingFiller(text.trim().replace(/^[\s"'“”‘’.,;:!?-]+/, ''))
    .replace(/[\s.!?,]+$/, '').replace(/[\s,]+please$/i, '').trim();
}

function matchRememberTrigger(text) {
  const cleaned = stripLeadingFiller(text.trim().replace(/^[\s"'“”‘’.,;:!?-]+/, ''));
  for (const re of REMEMBER_PATTERNS) {
    const m = cleaned.match(re);
    if (m) return cleaned.slice(m[0].length).trim();
  }
  return null;
}

function isRememberTrigger(text) {
  return matchRememberTrigger(text) !== null;
}

// Shared by both a fresh capture and an applied link — both responses now
// carry the same shape: { node, neighbor_id, confirmation, graph }.
function applyGraphGrowth(data) {
  // Capture the neighbor's CURRENT simulated position before we swap the
  // dataset — this is what lets the new star be born right where it
  // belongs instead of dropping in at a random spot.
  const neighbor = (data.neighbor_id != null)
    ? GRAPH.nodes.find(n => n.id === data.neighbor_id)
    : null;
  const jitter = () => (Math.random() - 0.5) * 24;
  const birth = neighbor
    ? { x: (neighbor.x || 0) + jitter(), y: (neighbor.y || 0) + jitter(), z: (neighbor.z || 0) + jitter() }
    : { x: jitter() * 4, y: jitter() * 4, z: jitter() * 4 };

  const newNode = data.graph.nodes.find(n => n.id === data.node.id);
  if (newNode) { newNode.x = birth.x; newNode.y = birth.y; newNode.z = birth.z; }

  GRAPH.nodes = data.graph.nodes;
  GRAPH.links = data.graph.links;
  Graph.graphData(GRAPH);
  document.getElementById('node-count').textContent =
    `${GRAPH.nodes.length} notes indexed · ${GRAPH.links.length} links`;
  updateEmptyHint();

  addMsg(data.confirmation, 'assistant');
  speak(data.confirmation);

  // Brief glow pulse, THEN fly the camera to it.
  const clearGlow = highlightCluster([data.node.id]);
  setTimeout(() => {
    clearGlow();
    if (newNode) { flyTo(newNode); showPanel(newNode); }
  }, 1000);

  return newNode;
}

async function sendCreatePersonAction(sourcePath, name, category) {
  setStatus('Thinking…');
  try {
    const res = await fetch('/create-person', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name, category, source_path: sourcePath }),
    });
    const data = await res.json();
    if (!data.ok) {
      addMsg(data.error || 'Could not create that note.', 'error');
      setStatus('');
      return;
    }
    applyGraphGrowth(data);
  } catch (e) {
    addMsg('Could not reach the server: ' + e.message, 'error');
    setStatus('');
  }
}

async function organise(text) {
  setStatus('Organising…');
  try {
    const d = await (await fetch('/organise', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text,
                             previous_text: lastThing && lastThing.kind === 'chat' ? lastThing.text : null,
                             focus_path: lastThing && lastThing.kind === 'note' ? lastThing.path : null,
                             history: CHAT_HISTORY.slice(-6) }) })).json();
    setStatus('');

    chatInput.value = ''; addMsg(text, 'user');

    if (d.ok && d.undo) addUndoButton(d.undo);

  } catch (e) { setStatus(''); return null; }
}

function fmtWhen(iso) { if (!iso) return '—'; const d = new Date(iso); return isNaN(d) ? iso : d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }); }

async function onStarRightClick(node, ev) {
  if (!node || !node.path) return;
  lastThing = { kind: 'note', path: node.path };
  // Second star of "Link star": right-clicking it links the two, no menu.
  if (replaceFrom && replaceFrom.path !== node.path) {       // 4.5.0: "this replaces an older note"
    const newer = replaceFrom; replaceFrom = null; banner('');
    await nodeSet({ path: newer.path, supersedes_path: node.path });
    return;
  }
  if (linkFrom && linkFrom.path !== node.path) {
    const from = linkFrom; linkFrom = null; banner('');
    await starOp({ op: 'link', path: from.path, other: node.path });
    return;
  }
  let info = { category: null, is_category: false, categories: [] };
  try { info = await (await fetch('/stars/info?path=' + encodeURIComponent(node.path))).json(); } catch (e) {}
  starMenu.innerHTML = '';
  const head = document.createElement('div'); head.className = 'head';
  head.textContent = (info.is_category ? 'Category: ' : '') + node.label + (info.category ? `  ·  in ${info.category}` : '');
  starMenu.appendChild(head);
  const item = (label, fn, cls) => {
    const b = document.createElement('button'); b.textContent = label; if (cls) b.className = cls;
    b.onclick = () => { closeStarMenu(); fn(); }; starMenu.appendChild(b);
  };
  const hr = () => starMenu.appendChild(document.createElement('hr'));
  item('Rename star', () => dialog({ title: info.is_category ? 'Rename category' : 'Rename star', value: node.label,
                                     onOk: v => v && v.trim() && starOp({ op: 'rename', path: node.path, title: v }) }));
  item('Change star contents', async () => {
    let r = null;
    try { r = await (await fetch('/stars/read?path=' + encodeURIComponent(node.path))).json(); } catch (e) {}
    if (!r || !r.ok) { addMsg((r && r.spoken) || "I couldn't open that note.", 'error'); return; }
    dialog({ title: 'Change star contents', note: 'The previous version is kept, and Undo puts it back.', value: r.text,
             multiline: true, onOk: v => starOp({ op: 'edit', path: node.path, text: v }) });
  });
  item('Details…', () => showNodeDetails(node));
  item('Link star', () => { linkFrom = { path: node.path, label: node.label };
                            banner(`Right-click the star to link with '${node.label}' · Esc to cancel`); });
  hr();
  const group = selected.size ? [...new Set([...selected.keys(), node.path])] : [node.path];
  if (!info.is_category) {
    item(group.length > 1 ? `Put ${group.length} selected in category…` : (info.category ? 'Change category…' : 'Put in category…'),
         () => dialog({ title: group.length > 1 ? `Put ${group.length} stars in a category` : 'Put in a category',
                        note: 'Pick one or type a new name.', value: '', options: info.categories || [], okText: 'Put in',
                        onOk: async v => { if (!v || !v.trim()) return; const d = await starOp({ op: 'categorise', paths: group, name: v });
                                           if (d && d.ok) { selected.clear(); paintSelection(); } } }));
    if (info.category) item('Take out of category', () => starOp({ op: 'uncategorise', path: node.path }));
    item(selected.has(node.path) ? 'Unselect' : 'Select (to group several)', () => {
      if (selected.has(node.path)) selected.delete(node.path); else selected.set(node.path, node.label);
      paintSelection();
    });
    if (selected.size) item('Clear selection', () => { selected.clear(); paintSelection(); });
  }
  hr();
  item('Delete star', () => dialog({ title: `Delete '${node.label}'?`,
    note: info.is_category ? "The category goes to Jarvis's bin; the notes in it stay, just uncategorised. Undo brings it all back."
                           : "It moves to Jarvis's bin (notes\\.jarvis\\bin), not gone for good, and Undo puts it back.",
    okText: 'Delete', danger: true, onOk: () => starOp({ op: 'delete', path: node.path }) }), 'danger');
  const x = (ev && ev.clientX) || window.innerWidth / 2, y = (ev && ev.clientY) || window.innerHeight / 2;
  starMenu.style.display = 'block';
  starMenu.style.left = Math.max(8, Math.min(x, window.innerWidth - starMenu.offsetWidth - 8)) + 'px';
  starMenu.style.top = Math.max(8, Math.min(y, window.innerHeight - starMenu.offsetHeight - 8)) + 'px';
}

// ---------- 3.10.0: the emblem, and lights on what's being thought about ----------
// The emblem's state is read from what Jarvis is actually doing: speaking,
// working ("Thinking…", "Sorting…", "Linking…"), or listening.
const hud = document.getElementById('hud');
const HUD_STATES = { online: '● ONLINE', listening: '● LISTENING', thinking: '● THINKING', speaking: '● SPEAKING' };
let hudNow = null;
function hudState() {
  if (typeof speechSynthesis !== 'undefined' && speechSynthesis.speaking) return 'speaking';
  const st = (statusLine.textContent || '').toLowerCase();
  if (st && !st.startsWith('speaking')) return 'thinking';
  if (isListening) return 'listening';
  return 'online';
}
setInterval(() => {
  const s = hudState();
  if (s === hudNow) return;
  hudNow = s;
  hud.className = s;
  document.getElementById('hud-state').textContent = HUD_STATES[s];
}, 150);
// The model badge: the brain you've chosen, then the actual model after each answer.
function setHudModel(label, full) {
  if (!label) return;
  const short = String(label).split('/').pop().replace(/:free$/, '');
  const el = document.getElementById('hud-model');
  el.textContent = '◆ ' + short;
  el.title = full || label;
}

// Thinking lights: while a question is out, small lights run along the
// connections of the notes that question is being answered from -- the same
// notes /chat scores -- and only those. Small talk lights nothing.
const THINK = { PARTICLES: 3, SPEED: 0.012, WIDTH: 1.8, COLOR: '#8ff0ff' };
let thinkingIds = null;
const endId = e => (typeof e === 'object' && e !== null ? e.id : e);
function setThinking(ids) {
  thinkingIds = ids && ids.length ? new Set(ids) : null;
  try {
    Graph.linkDirectionalParticles(l => thinkingIds && (thinkingIds.has(endId(l.source)) || thinkingIds.has(endId(l.target))) ? THINK.PARTICLES : 0)
         .linkDirectionalParticleSpeed(THINK.SPEED).linkDirectionalParticleWidth(THINK.WIDTH)
         .linkDirectionalParticleColor(() => THINK.COLOR);
  } catch (e) {}
}
async function thinkAbout(question) {
  try {
    const d = await (await fetch('/retrieve?q=' + encodeURIComponent(question))).json();
    if (statusLine.textContent) setThinking(d.ids);     // only if still waiting for the answer
  } catch (e) {}
}

async function linkNotes(action, text) {
  setStatus('Linking…');
  try {
    const d = await (await fetch('/links', { method: 'POST', headers: { 'Content-Type': 'application/json' },
                                             body: JSON.stringify({ action, text }) })).json();
    setStatus('');
    addMsg(d.spoken, 'assistant'); speak(d.spoken);
    if (!d.ok && d.retry && d.retry.length) {
      const row = document.createElement('div');
      row.className = 'msg system';
      d.options.forEach((o, i) => {
        const b = document.createElement('button');
        b.textContent = o; b.style.cssText = 'margin:2px 4px 2px 0;cursor:pointer';

        row.appendChild(b);
      });

    }
    if (d.ok && d.graph) applyGraph(d.graph, d.node_ids);

}
